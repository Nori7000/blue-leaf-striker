<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061722">
<meta name="description" content="スマホのブラウザで遊べる横スクロールシューティング。Blue Leaf Studio 制作。">
<meta property="og:title" content="BLUE LEAF STRIKER">
<meta property="og:description" content="スマホのブラウザで遊べる横スクロールシューティング。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>

</head>
<body>
<title>Blue Leaf Striker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one-screen game. Play field fills the top, power gauge docks below like a console strip. */
:root{
  --sea:#061722;      /* open water background */
  --deep:#0a2433;     /* panels */
  --reef:#0f3a4a;     /* terrain fill */
  --edge:#3a9db0;     /* terrain contour */
  --leaf:#5cc8ff;     /* player ship, primary accent */
  --leaf-hi:#d2f2ff;
  --coral:#ff7a6b;    /* enemies */
  --sun:#ffc75a;      /* capsules, gauge */
  --ink:#e7f3f7;
  --mute:#8fb3bf;
  --line:rgba(143,179,191,.22);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html{box-sizing:border-box;height:100%;background:var(--sea)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--sea);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px;touch-action:none;cursor:crosshair}
#screen{position:relative;max-width:100%}
canvas{display:block;border-radius:6px;outline:1px solid var(--line)}
#hud{position:absolute;inset:0 0 auto 0;display:flex;align-items:center;gap:14px;padding:8px 10px;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink);pointer-events:none}
#hud .lbl{color:var(--mute);font-size:10px;letter-spacing:.1em;margin-right:4px}
#hud .sp{flex:1}
#hud > span{white-space:nowrap}
@media (max-width:460px){#hud{gap:9px;font-size:11px}#hud .lbl{margin-right:2px}#topWrap{display:none!important}}
#hud button{pointer-events:auto;width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:rgba(10,36,51,.7);color:var(--ink);font:500 12px var(--f-mono);cursor:pointer}
#hud button:focus-visible,.btn:focus-visible,#power:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
#panel{flex:none;display:flex;gap:10px;align-items:stretch;padding:10px 16px;border-top:1px solid var(--line);background:var(--deep);touch-action:none}
#gauge{flex:1;min-width:0;display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.cell{border:1px solid var(--line);border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:10px;letter-spacing:.03em;color:var(--mute);min-height:42px;text-align:center;padding:2px;overflow:hidden;transition:background .12s,color .12s}
.cell.on{background:var(--sun);border-color:var(--sun);color:var(--sea)}
.cell.max{opacity:.35}
.cell .s{display:none}
@media (max-width:520px){.cell .l{display:none}.cell .s{display:inline}#power{width:84px}}
.mode{display:flex;flex-direction:column;gap:6px}
.mode-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mode-row .lbl{font:500 11px var(--f-mono);letter-spacing:.12em;color:var(--mute)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--mute);padding:8px 16px;font:700 13px var(--f-mono);letter-spacing:.06em;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--leaf);color:var(--sea)}
.seg button:focus-visible{outline:2px solid var(--sun);outline-offset:-2px}
.mode-desc{margin:0;font-size:13px;color:var(--mute);line-height:1.6}
.monthly{display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--sun);border-radius:10px;background:rgba(255,199,90,.06)}
.monthly h3{margin:0;font:700 18px var(--f-body)}
.monthly p{margin:0;font-size:13px;line-height:1.6;color:var(--mute)}
.monthly .rule{color:var(--ink)}
#power{flex:none;width:100px;border:0;border-radius:8px;background:var(--leaf);color:var(--sea);font:700 13px var(--f-display);letter-spacing:.06em;cursor:pointer}
#power:disabled{background:var(--reef);color:var(--mute);cursor:default}
#power{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.1}
#power small{font:500 10px var(--f-mono);letter-spacing:.04em}
#power.ready{animation:ready 1s ease-in-out infinite;box-shadow:0 0 0 0 rgba(92,200,255,.6)}
@keyframes ready{50%{box-shadow:0 0 0 6px rgba(92,200,255,0)}}
#gauge{cursor:pointer}
@media (prefers-reduced-motion:reduce){#power.ready{animation:none}}
#overlay{position:fixed;inset:0;z-index:5;display:flex;align-items:flex-start;justify-content:center;padding:16px;background:rgba(6,23,34,.78);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);overflow:auto}
.card{width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px;margin:auto}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--sun)}
.logo{font:700 clamp(28px,8vw,44px)/1.02 var(--f-display);letter-spacing:-.01em;text-wrap:balance;margin:0}
.logo span{color:var(--leaf)}
.lead{font-size:14px;line-height:1.7;color:var(--mute);margin:0}
.how{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0;font-size:14px;line-height:1.55}
.how dt{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;color:var(--sun);padding-top:4px}
.how dd{margin:0}
.big{font:700 clamp(24px,7vw,36px)/1.1 var(--f-display);margin:0}
.score{display:flex;gap:24px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.score div{display:flex;flex-direction:column;gap:2px}
.score small{font-size:10px;letter-spacing:.12em;color:var(--mute)}
.score b{font-size:22px;font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:0;border-radius:8px;padding:13px 22px;background:var(--leaf);color:var(--sea);font:700 14px var(--f-body);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.studio{font-size:13px;color:var(--mute);border-top:1px solid var(--line);padding-top:12px;line-height:1.6}
.studio a{color:var(--leaf);text-decoration:none;font-weight:700}
.studio a:hover{text-decoration:underline}
.tut-tabs{display:flex;gap:6px;flex-wrap:wrap}
.tut-tabs button{border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:999px;padding:6px 12px;font:500 12px var(--f-body);cursor:pointer}
.tut-tabs button[aria-current="true"]{background:var(--sun);border-color:var(--sun);color:var(--sea)}
.tut-list{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:620px){.tut-list.two{grid-template-columns:1fr 1fr}}
.tut-item{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:8px;padding:10px;background:rgba(10,36,51,.6);min-width:0}
.tut-item canvas{width:100%;height:76px;border-radius:5px;outline:none}
.tut-item h3{margin:0;font:700 14px var(--f-body);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tut-item h3 small{font:500 11px var(--f-mono);color:var(--sun);letter-spacing:.06em}
.tut-item p{margin:0;font-size:13px;line-height:1.6;color:var(--mute)}
.tut-flow canvas{height:104px}
.tut-note{margin:0;padding:10px 12px;border-left:3px solid var(--sun);background:rgba(255,199,90,.08);font-size:13px;line-height:1.7}
.board-wrap{display:flex;flex-direction:column;gap:8px}
.board-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.seg-sm button{padding:5px 12px;font-size:12px}
.board-period{margin:0;font-size:12px;color:var(--mute)}
.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.board li{display:grid;grid-template-columns:2.2em 1fr auto;gap:10px;align-items:baseline;padding:7px 2px;border-bottom:1px solid var(--line);font-size:14px}
.board .rk{font-family:var(--f-mono);font-size:11px;color:var(--mute)}
.board li:first-child .rk{color:var(--sun)}
.board .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .pt{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.board li.me{background:rgba(92,200,255,.1)}
.board li.me .nm::after{content:"  あなた";color:var(--leaf);font-size:11px}
.board-note{font-size:13px;color:var(--mute);margin:0;line-height:1.6}
.entry{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.entry label{width:100%;font-size:13px;color:var(--mute)}
.entry input{flex:1;min-width:0;padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:var(--deep);color:var(--ink);font:500 15px var(--f-body)}
.entry input:focus-visible{outline:2px solid var(--sun);outline-offset:1px}
@media (max-height:520px){.card{gap:10px}.logo{font-size:26px}.lead{display:none}.how{font-size:13px;gap:4px 12px}}
@media (prefers-reduced-motion:reduce){.cell{transition:none}}
</style>

<div id="app">
  <div id="stage">
    <div id="screen">
      <canvas id="cv" aria-label="ゲーム画面"></canvas>
      <div id="hud">
        <span><span class="lbl">SCORE</span><span id="sc">0</span></span>
        <span><span class="lbl">HI</span><span id="hi">0</span></span>
        <span><span class="lbl">ST</span><span id="st">1</span></span>
        <span><span class="lbl">残機</span><span id="lv">2</span></span>
        <span id="topWrap" hidden><span class="lbl">TOP</span><span id="top"></span></span>
        <span class="sp"></span>
        <button id="mute" type="button" aria-label="音のオン・オフ">♪</button>
        <button id="pause" type="button" aria-label="一時停止">II</button>
      </div>
    </div>
  </div>
  <div id="panel">
    <div id="gauge" aria-label="パワーアップゲージ"></div>
    <button id="power" type="button" disabled><span>POWER</span><small id="powerItem"></small></button>
  </div>
</div>
<div id="overlay"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const cv = $('#cv'); let ctx = cv.getContext('2d'); const stage = $('#stage'), screenEl = $('#screen'), overlay = $('#overlay');
const css = getComputedStyle(document.documentElement);
const C = {}; ['sea','deep','reef','edge','leaf','leaf-hi','coral','sun','ink','mute'].forEach(k => C[k] = css.getPropertyValue('--' + k).trim());
const H = 360; let W = 640, scale = 1;
const ITEMS = {
  SPEED:   { short:'SPD', can:p => p.spd < 4,          auto:p => p.spd < 4,           apply:p => p.spd++ },
  MISSILE: { short:'MIS', can:p => !p.missile,         auto:p => !p.missile,          apply:p => p.missile = true },
  TWIN:    { short:'TWN', can:p => p.weapon !== 't',   auto:p => p.weapon === 'n',    apply:p => p.weapon = 't' },
  BEAM:    { short:'BEM', can:p => p.weapon !== 'b',   auto:p => p.weapon === 'n',    apply:p => p.weapon = 'b' },
  DRONE:   { short:'DRN', can:p => p.opts < 2,         auto:p => p.opts < 2,          apply:p => p.opts++ },
  SNIPER:  { short:'SNP', can:p => p.snipers < 2,      auto:p => p.snipers < 2,       apply:p => p.snipers++ },
  SHIELD:  { short:'SHD', can:p => p.shield <= 0,      auto:p => p.shield <= 0,       apply:p => p.shield = 3 }
};
const gaugeList = stg => stg >= 2 ? ['SPEED','MISSILE','TWIN','BEAM','DRONE','SNIPER','SHIELD'] : ['SPEED','MISSILE','TWIN','BEAM','DRONE','SHIELD'];
let GAUGE = gaugeList(1);
let itemMode = 'auto';
const STUDIO_URL = 'https://blue-leaf-studio.blog/';
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };
let hi = +store.get('bls_hi') || 0;
itemMode = store.get('bls_mode') === 'manual' ? 'manual' : 'auto';

/* ---------- layout ---------- */
function resize(){
  const r = stage.getBoundingClientRect();
  const aw = r.width - 16, ah = r.height - 16;
  if (aw < 50 || ah < 50) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.round(Math.max(420, Math.min(760, H * aw / ah)));
  let cw = aw, ch = cw * H / W;
  if (ch > ah){ ch = ah; cw = ch * W / H; }
  screenEl.style.width = cw + 'px'; screenEl.style.height = ch + 'px';
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  scale = cv.width / W;
}
addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);

/* ---------- audio ---------- */
let ac = null, muted = false;
function initAudio(){ if (ac) { ac.resume && ac.resume(); return; } try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
function tone(f, dur, type='square', vol=.05, slide=0){
  if (!ac || muted) return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur);
}
function noise(dur, vol=.12){
  if (!ac || muted) return;
  const n = Math.floor(ac.sampleRate * dur), b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
  s.buffer = b; g.gain.value = vol; f.type = 'lowpass'; f.frequency.value = 1400;
  s.connect(f).connect(g).connect(ac.destination); s.start();
}
/* BGM: one <audio> element for every track, so phones that unlock it on the first tap keep allowing track changes */
const TRACKS = {
  title: { src:'music/title.mp3', loop:[0, 181],   vol:.45 },
  stage: { src:'music/stage.mp3', loop:[2, 155.5], vol:.4 },
  boss:  { src:'music/boss.mp3',  loop:[0, 106.5], vol:.45 },
  clear: { src:'music/clear.mp3', vol:.6 },
  over:  { src:'music/over.mp3',  vol:.6 }
};
const bgm = new Audio(); bgm.preload = 'auto';
let curTrack = null, audioUnlocked = false;
function playTrack(name){
  const tr = TRACKS[name]; if (!tr) return;
  if (curTrack === name && !bgm.paused) return;
  curTrack = name; bgm.src = tr.src; bgm.loop = false; bgm.volume = tr.vol; bgm.muted = muted;
  const p = bgm.play(); if (p) p.catch(() => {});
}
function stopTrack(){ bgm.pause(); curTrack = null; }
function resumeTrack(){ if (curTrack && bgm.paused){ const p = bgm.play(); if (p) p.catch(() => {}); } }
function tickMusic(){
  const tr = curTrack && TRACKS[curTrack];
  if (tr && tr.loop && !bgm.paused && bgm.currentTime >= tr.loop[1]) bgm.currentTime = tr.loop[0];
}
function unlockAudio(){
  if (audioUnlocked) return; audioUnlocked = true; initAudio();
  if (!G && !curTrack) playTrack('title');
}
addEventListener('pointerdown', unlockAudio, { capture:true });
addEventListener('keydown', unlockAudio, { capture:true });
const sfx = {
  small: () => noise(.14, .08),
  pick:  () => { tone(880, .07, 'square', .035); setTimeout(() => tone(1320, .09, 'square', .035), 60); },
  power: () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, .1, 'triangle', .06), i * 55)),
  hit:   () => tone(240, .05, 'square', .025, -120),
  die:   () => { noise(.8, .2); tone(320, .6, 'sawtooth', .05, -280); },
  boss:  () => { noise(1.4, .24); tone(120, 1.2, 'sawtooth', .06, -80); }
};

/* ---------- terrain ---------- */
let TA = 1; // terrain amplitude 0..1
const stg = () => (G ? G.stage : 1);
const LAST_STAGE = 5;
const STAGES = {
  1:{ name:'海底の洞窟',   sub:'海底の洞窟' },
  2:{ name:'深海の裂け目', sub:'深海の裂け目 ・ 新アイテム SNIPER 登場' },
  3:{ name:'沈没船',       sub:'沈没船 ・ 壊せる壁と、後ろから来る敵に注意' },
  4:{ name:'熱水噴出孔',   sub:'熱水噴出孔 ・ 噴き上がる熱水と火山弾に注意' },
  5:{ name:'深海の玉座',   sub:'深海の玉座 ・ 最後の戦い' }
};
/* ---------- 今月のステージ (monthly stage) ----------
   Add one entry per month, keyed by Japan-time 'YYYY-MM'. A month without an entry keeps showing the newest past entry.
   base: which main stage the terrain/enemy behaviour is borrowed from (1-4), boss: core | jelly | fort | worm */
const MONTHLY = {
  '2026-10': {
    title:'10月：ランタン海溝', short:'ランタン海溝', base:2,
    look:{ reef:'#2a1630', edge:'#ff9a3c' },
    order:['fan','rear','carrier','fanLow','turrets','fan','carrier','rear','dash','fanLow','carrier','turrets','rear'],
    endT:70, boss:'jelly', bossName:'パンプキン・ジェリー',
    tint:{ bell:'rgba(255,140,40,.55)', line:'#ffc27a', tent:'#ff9a3c' },
    lives:0, capsX2:true, startItems:['SPEED'],
    rule:'残機なしの1機勝負。そのかわりカプセルが2倍出て、最初から SPEED が1段階付いています。'
  }
};
const jstMonth = () => { const d = new Date(Date.now() + 9 * 3600e3); return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0'); };
function monthlyNow(){
  const cur = jstMonth(), keys = Object.keys(MONTHLY).sort();
  const key = MONTHLY[cur] ? cur : keys.filter(k => k <= cur).pop() || keys[0];
  return key ? { key, rankKey:'monthly-' + key, current:key === cur, ...MONTHLY[key] } : null;
}
const stepQ = v => Math.round(v / 12) * 12;
const tri = v => Math.abs((((v % 1) + 1) % 1) * 2 - 1); // 0..1 sawtooth-like triangle wave for jagged rock
const ceilY  = wx => stg() === 5
  ? TA * (16 + 30 * Math.abs(Math.sin(wx * .012)) ** 3)
  : stg() === 4
  ? TA * (18 + 24 * tri(wx / 96) + 16 * (1 + Math.sin(wx * .007)) * .5)
  : stg() === 3
  ? TA * stepQ(20 + 30 * (1 + Math.sin(wx * .006)) * .5 + 20 * (1 + Math.sin(wx * .017 + 1)) * .5)
  : stg() === 2
  ? TA * (18 + 26 * (1 + Math.sin(wx * .014 + .7)) * .5 + 30 * (1 + Math.sin(wx * .0052)) * .5)
  : TA * (14 + 18 * (1 + Math.sin(wx * .011)) * .5 + 22 * (1 + Math.sin(wx * .0047 + 1.3)) * .5);
const floorY = wx => stg() === 5
  ? H - TA * (16 + 30 * Math.abs(Math.sin(wx * .012)) ** 3)
  : stg() === 4
  ? H - TA * (22 + 26 * tri(wx / 84 + .4) + 18 * (1 + Math.sin(wx * .006 + 2)) * .5)
  : stg() === 3
  ? H - TA * stepQ(24 + 34 * (1 + Math.sin(wx * .005 + 2)) * .5 + 18 * (1 + Math.sin(wx * .015)) * .5)
  : stg() === 2
  ? H - TA * (20 + 26 * (1 + Math.sin(wx * .012 + 2.4)) * .5 + 32 * (1 + Math.sin(wx * .0041 + 1.1)) * .5)
  : H - TA * (16 + 20 * (1 + Math.sin(wx * .009 + 2)) * .5 + 26 * (1 + Math.sin(wx * .0031 + .4)) * .5);
const STAGE_LOOK = { 1:{ reef:null, edge:null }, 2:{ reef:'#1b2546', edge:'#8ea2ff' }, 3:{ reef:'#3a2a20', edge:'#d39a5b' }, 4:{ reef:'#24120f', edge:'#ff8a3d' }, 5:{ reef:'#1d1630', edge:'#e6c36a' } };
const BOSS_EDGE = { 2:'#8ea2ff', 3:'#d39a5b' };
const terrCol = k => (G && G.mcfg && G.mcfg.look[k]) || (STAGE_LOOK[stg()] && STAGE_LOOK[stg()][k]) || C[k];

/* ---------- game state ---------- */
let G = null;
function buildMonthlyScript(cfg){
  const ev = []; let t = 2.5, k = 0;
  while (t < cfg.endT){ const type = cfg.order[k % cfg.order.length]; ev.push({ t, type }); t += type === 'turrets' || type === 'wall' || type === 'vents' ? 5 : 3.4; k++; }

/* ---------- STAGE 4: hydrothermal vents ---------- */
const VENT_CYCLE = 4.2;
function ventState(v){
  const ph = (G.t + v.off) % VENT_CYCLE;
  return ph < 2.2 ? { phase:'idle', ph } : ph < 3 ? { phase:'warn', ph:ph - 2.2 } : { phase:'erupt', ph:ph - 3 };
}
const ventBase = v => v.top ? ceilY(v.wx) + 14 : floorY(v.wx) - 14;

  const st = ventState(v); if (st.phase !== 'erupt') return null;

}
function drawVent(v){

  const mouth = b + dir * 14;
  if (st.phase === 'warn'){

    ctx.strokeStyle = 'rgba(255,199,90,.7)'; ctx.lineWidth = 1;
    for (let i = 0; i < 3; i++){ const yy = mouth + dir * (8 + ((st.ph * 60 + i * 14) % 40)); ctx.beginPath(); ctx.arc(x + (i - 1) * 6, yy, 2.5, 0, 6.283); ctx.stroke(); }
  }
  const c = ventColumn(v);

}

/* ---------- boss 4: ヒートワーム (sea worm; only the head takes damage, body segments block shots) ---------- */
// body segments sit every 22px along the path the head has travelled
function wormSegs(b){
  const out = [], H0 = b.hist; let need = 22, acc = 0, i = H0.length - 1, px = b.x, py = b.y;
  while (out.length < b.segs.length && i >= 0){
    const q = H0[i], d = Math.hypot(q.x - px, q.y - py);
    if (acc + d >= need){ const f = (need - acc) / d; px += (q.x - px) * f; py += (q.y - py) * f; out.push({ x:px, y:py, s:b.segs[out.length], i:out.length }); acc = 0; continue; }
    acc += d; px = q.x; py = q.y; i--;
  }
  while (out.length < b.segs.length) out.push({ x:px + (out.length + 1) * 4, y:py, s:b.segs[out.length], i:out.length });
  return out;
}
function updateWorm(b, dt){
  b.t += dt; b.flash = Math.max(0, b.flash - dt);
  const tx = W * .6 + W * .22 * Math.cos(b.t * .7), ty = H / 2 + 105 * Math.sin(b.t * 1.4);
  b.x += (tx - b.x) * Math.min(1, dt * 1.6); b.y += (ty - b.y) * Math.min(1, dt * 1.6);
  b.hist.push({ x:b.x, y:b.y }); if (b.hist.length > 600) b.hist.shift();
  b.cd -= dt;
  if (b.cd <= 0 && b.x < W - 30 && G.p){
    b.cd = 1.5; const a = Math.atan2(G.p.y - b.y, G.p.x - b.x);
    for (let k = -1; k <= 1; k++) G.eb.push({ x:b.x, y:b.y, vx:Math.cos(a + k * .25) * 160, vy:Math.sin(a + k * .25) * 160 });
  }
}
function shotVsWorm(b, s){
  const hit = (x, y, r) => s.k === 'b' ? Math.abs(s.y - y) < r && s.x >= x - r && s.x - s.len <= x + r : d2(s, { x, y }) < r * r;
  if (hit(b.x, b.y, 16)) return damageBoss(b, s, s.k === 'm' ? 2 : 1);
  for (const g of wormSegs(b)){
    if (g.s.hp <= 0 || !hit(g.x, g.y, 13)) continue;
    s.dead = true; g.s.hp -= s.k === 'm' ? 2 : 1; b.flash = .03; sfx.hit();
    if (g.s.hp <= 0){ burst(g.x, g.y, '#ff8a3d', 12, .8); G.score += 200; floatText(g.x, g.y - 10, '+200', C.ink, .8, 10); }
    return;
  }
}
function drawWorm(b){
  const segs = wormSegs(b);
  for (let i = segs.length - 1; i >= 0; i--){
    const g = segs[i]; if (g.s.hp <= 0){ ctx.fillStyle = 'rgba(255,138,61,.15)'; ctx.beginPath(); ctx.arc(g.x, g.y, 5, 0, 6.283); ctx.fill(); continue; }
    const r = 13 - i * .4;
    ctx.fillStyle = '#3a1d16'; ctx.strokeStyle = b.flash > 0 ? C.ink : '#ff8a3d'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(g.x, g.y, r, 0, 6.283); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ff8a3d'; ctx.globalAlpha = .35 + .35 * (g.s.hp / 4); ctx.beginPath(); ctx.arc(g.x, g.y, r * .45, 0, 6.283); ctx.fill(); ctx.globalAlpha = 1;
  }
  // head: jaws open toward the ship
  const a = G && G.p ? Math.atan2(G.p.y - b.y, G.p.x - b.x) : Math.PI;
  ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(a);
  ctx.fillStyle = b.flash > 0 ? C.ink : C.coral; ctx.beginPath(); ctx.arc(0, 0, 17, .5, 6.283 - .5); ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();
  ctx.fillStyle = C.sun; ctx.beginPath(); ctx.arc(-4, -7, 3, 0, 6.283); ctx.arc(-4, 7, 3, 0, 6.283); ctx.fill();

}

/* ---------- boss: shared helpers ---------- */
const BOSS_NAME = { core:'コア', jelly:'深淵クラゲ', fort:'幽霊戦艦', worm:'ヒートワーム', king:'深海の王' };

  if (b.type === 'king'){ const g = b.gems.find(g => g.hp > 0); return g ? { x:b.x - 44, y:b.y + g.dy } : kingMouth(b); }
  if (b.type === 'fort'){ const c = b.cannons.find(c => c.hp > 0); return c ? { x:b.x - 40, y:b.y + c.dy } : { x:b.x - 38, y:b.y }; }
  const i = b.plates.findIndex(v => v > 0); return i >= 0 ? { x:plateX(b, i), y:b.y } : { x:b.x - 22, y:b.y };
}
function bossTouches(b, p){
  if (b.type === 'king') return ((p.x - (b.x + 20)) / 80) ** 2 + ((p.y - b.y) / 110) ** 2 < 1;

    ctx.fillStyle = b.flash > 0 ? C.ink : C.coral; ctx.beginPath(); ctx.arc(cx, cy, 12, 0, 6.283); ctx.fill();
    ctx.strokeStyle = rust; ctx.lineWidth = 2; ctx.stroke();
  }
  ctx.restore();
}

const plateX = (b, i) => b.x - 38 - (b.plates.length - 1 - i) * 10;
function killBoss(){
  const b = G.boss; b.dead = true; G.shake = 1.2; sfx.boss(); burst(b.x, b.y, C.coral, 60, 2); G.eb.length = 0;
  if (G.rush && G.rush.length){
    G.score += 5000; floatText(W / 2, H / 2 - 20, `BOSS ${G.rushN} / 4  +5000`, C.sun, 2, 16); G.nextBossT = 2.6; return;
  }
  stopTrack(); G.bossDead = true; G.clearT = b.type === 'king' ? 4 : 2.8; G.score += b.type === 'king' ? 30000 : 10000;
}

/* ---------- main update ---------- */
const d2 = (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2;
function update(dt){
  G.t += dt; G.shake = Math.max(0, G.shake - dt);
  const speed = G.boss ? 30 : 60; G.scroll += speed * dt;
  TA = G.boss ? Math.max(0, TA - dt / 3) : Math.min(1, G.t / 5);
  while (G.si < G.script.length && G.script[G.si].t <= G.t){ spawn(G.script[G.si].type); G.si++; }

  if (G.p) updatePlayer(dt);
  else { G.respawn -= dt; if (G.respawn <= 0){ if (G.lives > 0){ G.lives--; spawnPlayer(); } else return gameOver(); } }

  for (const s of G.shots){
    s.x += s.vx * dt; s.y += s.vy * dt;
    const wx = s.x + G.scroll;
    if (s.k === 'm'){ const fy = floorY(wx); if (!s.ground && s.y >= fy - 4){ s.ground = true; s.vx = 200; s.vy = 0; } if (s.ground) s.y = fy - 4; }
    else if (s.k === 'n' && (s.y < ceilY(wx) || s.y > floorY(wx))) s.dead = true;
    if (s.x - (s.len || 0) > W + 10 || s.y < -10 || s.y > H + 10) s.dead = true;
  }

  for (const e of G.en){
    e.t += dt;
    if (e.kind === 'fan'){ e.x += e.vx * dt; e.y = e.yb + 40 * Math.sin(e.x * .026 + e.ph);
      if (e.shooter){ e.cd -= dt; if (e.cd <= 0 && e.x < W - 20 && e.x > 60){ e.cd = 2.2 + Math.random(); aim(e.x, e.y, 120); } } }
    else if (e.kind === 'dash'){
      if (!e.aimed && e.x < W - 30 && G.p){ e.aimed = true; const tt = Math.max(.4, (e.x - G.p.x) / 210); e.vy = Math.max(-140, Math.min(140, (G.p.y - e.y) / tt)); }
      e.x += e.vx * dt; e.y += e.vy * dt;
    }
    else if (e.kind === 'carrier'){ e.x += e.vx * dt; e.y = e.yb + 26 * Math.sin(e.t * 2.2); }
    else if (e.kind === 'rear'){ e.x += e.vx * dt; e.y = e.yb + 30 * Math.sin(e.t * 3 + e.ph); }
    else if (e.kind === 'ember'){ e.vy += 300 * dt * e.g2; e.x += e.vx * dt; e.y += e.vy * dt; }
    else if (e.kind === 'tur'){
      e.x = e.wx - G.scroll; e.y = e.top ? ceilY(e.wx) + 6 : floorY(e.wx) - 6;
      e.cd -= dt; if (e.cd <= 0 && e.x < W - 10 && e.x > 40){ e.cd = 1.8 + Math.random() * .6; aim(e.x, e.y, 130); }
    }
    if ((e.kind === 'rear' ? e.x > W + 40 : e.x < -40) || e.y < -40 || e.y > H + 40) e.dead = true;
  }
  updateBoss(dt);
  for (const v of G.vents){
    v.x = v.wx - G.scroll; if (v.x < -40){ v.dead = true; continue; }
    const st = ventState(v);
    if (st.phase === 'erupt' && !v.erupted && v.x < W - 10){
      v.erupted = true; sfx.small();
      const base = ventBase(v);
      for (let i = 0; i < 2; i++) G.en.push({ id:G.eid++, kind:'ember', x:v.x, y:base, vx:-60 + Math.random() * 90, vy:(v.top ? 1 : -1) * (180 + Math.random() * 80), g2:v.top ? -1 : 1, r:7, hp:1, sc:50, t:0 });
    }
    if (st.phase !== 'erupt') v.erupted = false;
  }
  for (const k of G.blocks){ k.x = k.wx - G.scroll; if (k.x < -20){ k.dead = true; if (G.walls[k.w]) G.walls[k.w].lost = true; } }

  for (const s of G.shots){
    if (s.dead) continue;
    for (const e of G.en){
      if (e.dead) continue;
      let hit;
      if (s.k === 'b') hit = !s.hit.has(e.id) && s.x >= e.x - e.r && s.x - s.len <= e.x + e.r && Math.abs(s.y - e.y) < e.r + 2;
      else hit = d2(s, e) < (e.r + 3) ** 2;
      if (!hit) continue;
      if (s.k === 'b') s.hit.add(e.id); else s.dead = true;
      e.hp -= s.k === 'm' ? 2 : 1;
      if (e.hp <= 0) killEnemy(e); else sfx.hit();
      if (s.dead) break;
    }
    if (!s.dead) shotVsBlocks(s);
    if (!s.dead) shotVsBoss(s);
  }

  for (const b of G.eb){ b.x += b.vx * dt; b.y += b.vy * dt; if (b.x < -10 || b.x > W + 10 || b.y < -10 || b.y > H + 10) b.dead = true; }
  for (const c of G.caps){ c.t += dt; c.x -= 50 * dt; if (c.x < -20) c.dead = true; }

  const p = G.p;
  if (p){
    for (const e of G.en){
      if (e.dead || d2(p, e) >= (e.r + 4) ** 2 || p.inv > 0) continue;
      const shielded = p.shield > 0; hurtPlayer();
      if (shielded && e.kind !== 'tur') killEnemy(e);
      if (!G.p) break;
    }
  }
  if (G.p){
    for (const b of G.eb){ if (b.dead || G.p.inv > 0) continue; if (d2(G.p, b) < 30){ b.dead = true; hurtPlayer(); if (!G.p) break; } }
  }
  const bs = G.boss;
  if (G.p && bs && !bs.dead && G.p.inv <= 0 && bossTouches(bs, G.p)) hurtPlayer();
  if (G.p){
    for (const c of G.caps){ if (!c.dead && d2(G.p, c) < 200){ c.dead = true; gainCapsule(); } }
  }

  for (const q of G.parts){ q.l -= dt; q.x += (q.vx || 0) * dt; q.y += (q.vy || 0) * dt; if (q.vx){ q.vx *= .96; q.vy *= .96; } }
  G.shots = G.shots.filter(o => !o.dead); G.en = G.en.filter(o => !o.dead); G.eb = G.eb.filter(o => !o.dead);
  G.caps = G.caps.filter(o => !o.dead); G.blocks = G.blocks.filter(o => !o.dead); G.vents = G.vents.filter(o => !o.dead); G.parts = G.parts.filter(o => o.l > 0);
  for (const s of G.texts){ s.l -= dt; s.y -= 22 * dt; } G.texts = G.texts.filter(s => s.l > 0); if (G.hint > 0) G.hint -= dt;
  if (G.banner > 0) G.banner -= dt;
  if (G.bossBanner > 0) G.bossBanner -= dt;
  if (G.flashT > 0){ G.flashT -= dt; if (G.flashT <= 0) updatePanel(); }

  if (G.nextBossT > 0){ G.nextBossT -= dt; if (G.nextBossT <= 0) nextRush(); }
  if (G.bossDead){
    G.clearT -= dt;
    if (G.clearT > 1 && Math.random() < .3) burst(G.boss.x + (Math.random() - .5) * 90, G.boss.y + (Math.random() - .5) * 70, Math.random() < .5 ? C.coral : C.sun, 10, 1);
    if (G.clearT <= 0) return stageClear();
  }
}

/* ---------- drawing ---------- */
const dots = [0, 1].map(l => Array.from({ length: l ? 40 : 70 }, () => ({ x:Math.random() * 800, y:Math.random() * H })));
let bgScroll = 0;
function drawBg(scroll){
  ctx.fillStyle = C.sea; ctx.fillRect(-10, -10, W + 20, H + 20);
  dots.forEach((layer, l) => {
    ctx.fillStyle = l ? 'rgba(210,242,255,.55)' : 'rgba(143,179,191,.28)';
    const k = l ? .5 : .2, s = l ? 2 : 1.4;
    for (const d of layer){ const x = ((d.x - scroll * k) % 800 + 800) % 800; if (x < W) ctx.fillRect(x, d.y, s, s); }
  });
}
function drawTerrain(scroll){
  if (TA <= .01) return;
  for (const top of [true, false]){
    const f = top ? ceilY : floorY, edgeY = top ? 0 : H;
    ctx.beginPath(); ctx.moveTo(0, edgeY);
    for (let x = 0; x <= W + 8; x += 8) ctx.lineTo(x, f(x + scroll));
    ctx.lineTo(W + 8, edgeY); ctx.closePath(); ctx.fillStyle = terrCol('reef'); ctx.fill();
    ctx.strokeStyle = terrCol('edge'); ctx.lineWidth = 1.5; ctx.beginPath();
    for (let x = 0; x <= W + 8; x += 8){ const y = f(x + scroll); x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.stroke();
    ctx.globalAlpha = .3; ctx.lineWidth = 1; ctx.beginPath();
    const off = top ? -9 : 9;
    for (let x = 0; x <= W + 8; x += 8){ const y = f(x + scroll) + off * TA; x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.stroke(); ctx.globalAlpha = 1;
  }
}
function drawLeaf(x, y, s, blink){
  ctx.save(); ctx.translate(x, y);
  ctx.globalAlpha = blink ? .35 : 1;
  ctx.fillStyle = C.sun; ctx.globalAlpha *= .6 + Math.random() * .4;
  ctx.beginPath(); ctx.arc(-15 * s, 0, 3 * s, 0, 6.283); ctx.fill();
  ctx.globalAlpha = blink ? .35 : 1;
  ctx.fillStyle = C.leaf; ctx.beginPath();
  ctx.moveTo(15 * s, 0);
  ctx.quadraticCurveTo(2 * s, -12 * s, -12 * s, -1.5 * s);
  ctx.lineTo(-12 * s, 1.5 * s);
  ctx.quadraticCurveTo(2 * s, 10 * s, 15 * s, 0);
  ctx.fill();
  ctx.strokeStyle = C['leaf-hi']; ctx.lineWidth = 1.2 * s; ctx.beginPath();
  ctx.moveTo(-14 * s, 0); ctx.lineTo(11 * s, 0);
  ctx.moveTo(-2 * s, 0); ctx.lineTo(4 * s, -4.5 * s);
  ctx.moveTo(-2 * s, 0); ctx.lineTo(4 * s, 4 * s);
  ctx.stroke(); ctx.restore();
}
function drawEnemy(e){
  ctx.save(); ctx.translate(e.x, e.y);
  if (e.kind === 'fan'){
    ctx.rotate(e.t * 4); ctx.fillStyle = C.coral; ctx.fillRect(-6, -6, 12, 12);
    ctx.fillStyle = e.shooter ? C.ink : C.sea; ctx.fillRect(-2, -2, 4, 4);
  } else if (e.kind === 'dash'){
    ctx.rotate(Math.atan2(e.vy, e.vx) + Math.PI); ctx.fillStyle = C.coral;
    ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(8, -7); ctx.lineTo(4, 0); ctx.lineTo(8, 7); ctx.closePath(); ctx.fill();
  } else if (e.kind === 'carrier'){
    const pulse = 1 + .08 * Math.sin(e.t * 8);
    ctx.scale(pulse, pulse); ctx.strokeStyle = C.sun; ctx.lineWidth = 2.5; ctx.beginPath();
    for (let i = 0; i < 6; i++){ const a = i / 6 * 6.283 + e.t; ctx[i ? 'lineTo' : 'moveTo'](Math.cos(a) * 12, Math.sin(a) * 12); }
    ctx.closePath(); ctx.stroke(); ctx.fillStyle = C.sun; ctx.beginPath(); ctx.arc(0, 0, 4, 0, 6.283); ctx.fill();
  } else if (e.kind === 'ember'){
    ctx.rotate(e.t * 5); ctx.fillStyle = '#ff8a3d'; ctx.beginPath();
    for (let i = 0; i < 6; i++){ const a = i / 6 * 6.283, r = i % 2 ? 4 : 7; ctx[i ? 'lineTo' : 'moveTo'](Math.cos(a) * r, Math.sin(a) * r); }
    ctx.closePath(); ctx.fill(); ctx.fillStyle = C.sun; ctx.fillRect(-1.5, -1.5, 3, 3);
  } else if (e.kind === 'rear'){
    ctx.fillStyle = C.coral; ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(-7, -7); ctx.lineTo(-3, 0); ctx.lineTo(-7, 7); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = C.coral; ctx.globalAlpha = .5; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(-10, -4); ctx.lineTo(-16, -4); ctx.moveTo(-10, 4); ctx.lineTo(-16, 4); ctx.stroke(); ctx.globalAlpha = 1;
  } else if (e.kind === 'tur'){
    const dir = e.top ? 1 : -1;
    const tgt = e.aimAt || (G && G.p);
    if (tgt){ const a = Math.atan2(tgt.y - e.y, tgt.x - e.x); ctx.strokeStyle = C.coral; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * 13, Math.sin(a) * 13); ctx.stroke(); }
    ctx.fillStyle = C.coral; ctx.beginPath(); ctx.arc(0, -dir * 4, 10, e.top ? 0 : Math.PI, e.top ? Math.PI : 2 * Math.PI); ctx.fill();
  }
  ctx.restore();
}
function drawBoss(b){
  if (b.dead) return;
  if (b.type === 'jelly') return drawJelly(b);
  if (b.type === 'worm') return drawWorm(b);
  if (b.type === 'king') return drawKing(b);
  if (b.type === 'fort') return drawFort(b);
  ctx.save(); ctx.translate(b.x, b.y);
  ctx.fillStyle = C.deep; ctx.strokeStyle = b.flash > 0 ? C.ink : (BOSS_EDGE[b.mk] || C.edge); ctx.lineWidth = 3;
  ctx.beginPath(); for (let i = 0; i < 6; i++){ const a = i / 6 * 6.283; ctx[i ? 'lineTo' : 'moveTo'](14 + Math.cos(a) * 44, Math.sin(a) * 44); }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.lineWidth = 1.5; ctx.globalAlpha = .5; ctx.beginPath();
  for (let i = 0; i < 6; i++){ const a = i / 6 * 6.283 + b.t * .6; ctx[i ? 'lineTo' : 'moveTo'](14 + Math.cos(a) * 26, Math.sin(a) * 26); }
  ctx.closePath(); ctx.stroke(); ctx.globalAlpha = 1;
  const bx0 = plateX(b, 0) - b.x - 2, edge = BOSS_EDGE[b.mk] || C.edge, full = b.mk >= 2 ? 6 : 5;
  ctx.fillStyle = C.deep; ctx.fillRect(bx0, -18, -10 - bx0, 36);
  ctx.strokeStyle = edge; ctx.lineWidth = 1.5; ctx.strokeRect(bx0, -18, -10 - bx0, 36);
  b.plates.forEach((hp, i) => { if (hp > 0){ ctx.fillStyle = edge; ctx.globalAlpha = .4 + hp / full * .6; ctx.fillRect(plateX(b, i) - b.x - 3, -16, 6, 32); } });
  ctx.globalAlpha = 1;
  const open = b.plates.every(v => v <= 0);
  ctx.fillStyle = b.flash > 0 ? C.ink : C.coral; ctx.globalAlpha = open ? .75 + .25 * Math.sin(b.t * 10) : .6;
  ctx.beginPath(); ctx.arc(-22, 0, 9, 0, 6.283); ctx.fill(); ctx.globalAlpha = 1;
  ctx.restore();
}
function draw(){
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  if (G && G.shake > 0) ctx.translate((Math.random() - .5) * 8 * G.shake, (Math.random() - .5) * 8 * G.shake);
  const scroll = G ? G.scroll : bgScroll;
  if (!G) TA = 1;
  drawBg(scroll); drawTerrain(scroll);
  if (!G){ drawLeaf(W * .3, H / 2 + Math.sin(bgScroll * .05) * 14, 1.6, false); return; }
  for (const c of G.caps){
    const a = .7 + .3 * Math.sin(c.t * 9);
    ctx.fillStyle = C.sun; ctx.globalAlpha = a; ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(c.x - 8, c.y - 5, 16, 10, 5); else ctx.rect(c.x - 8, c.y - 5, 16, 10);
    ctx.fill(); ctx.globalAlpha = 1; ctx.fillStyle = C.sea; ctx.fillRect(c.x - 1, c.y - 3, 2, 6);
  }
  for (const v of G.vents) drawVent(v);
  for (const k of G.blocks){
    ctx.fillStyle = k.chest ? C.sun : terrCol('reef'); ctx.globalAlpha = k.hp >= 2 ? 1 : .7; ctx.fillRect(k.x - 7, k.y - 7, 14, 14);
    ctx.globalAlpha = 1; ctx.strokeStyle = k.chest ? C.sea : terrCol('edge'); ctx.lineWidth = 1; ctx.strokeRect(k.x - 6.5, k.y - 6.5, 13, 13);
    if (k.hp < 2){ ctx.beginPath(); ctx.moveTo(k.x - 4, k.y - 5); ctx.lineTo(k.x + 1, k.y); ctx.lineTo(k.x - 2, k.y + 5); ctx.stroke(); }
  }
  G.en.forEach(drawEnemy);
  const warn = G.en.find(e => e.kind === 'rear' && e.x < 0 && !e.dead);
  if (warn && Math.floor(G.t * 6) % 2 === 0){
    ctx.fillStyle = C.coral; ctx.beginPath(); ctx.moveTo(4, warn.y); ctx.lineTo(16, warn.y - 9); ctx.lineTo(16, warn.y + 9); ctx.closePath(); ctx.fill();
    ctx.font = '700 12px ' + getComputedStyle(document.documentElement).getPropertyValue('--f-mono'); ctx.textAlign = 'left'; ctx.fillText('!', 20, warn.y + 4);
  }
  if (G.boss) drawBoss(G.boss);
  for (const s of G.shots){
    if (s.k === 'b'){ ctx.strokeStyle = C.leaf; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(s.x - s.len, s.y); ctx.lineTo(s.x, s.y); ctx.stroke(); ctx.strokeStyle = C['leaf-hi']; ctx.lineWidth = 1; ctx.stroke(); }
    else if (s.k === 'm'){ ctx.fillStyle = C.sun; ctx.beginPath(); ctx.moveTo(s.x + 5, s.y); ctx.lineTo(s.x - 4, s.y - 3); ctx.lineTo(s.x - 4, s.y + 3); ctx.fill(); }
    else { const a = Math.atan2(s.vy, s.vx); ctx.strokeStyle = C['leaf-hi']; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - Math.cos(a) * 9, s.y - Math.sin(a) * 9); ctx.stroke(); }
  }
  for (const b of G.eb){ ctx.fillStyle = C.coral; ctx.beginPath(); ctx.arc(b.x, b.y, 3.5, 0, 6.283); ctx.fill(); ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(b.x, b.y, 1.4, 0, 6.283); ctx.fill(); }
  const p = G.p;
  if (p){
    optPos().forEach(o => { ctx.fillStyle = C['leaf-hi']; ctx.beginPath(); ctx.arc(o.x, o.y, 4, 0, 6.283); ctx.fill(); ctx.strokeStyle = C.leaf; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(o.x, o.y, 7, 0, 6.283); ctx.stroke(); });
    drawLeaf(p.x, p.y, 1, p.inv > 0 && Math.floor(p.inv * 12) % 2 === 0);
    for (const s of sniperPos()){
      const tg = sniperTarget(s), a = tg ? Math.atan2(tg.y - s.y, tg.x - s.x) : 0;
      ctx.save(); ctx.translate(s.x, s.y); ctx.fillStyle = C.sun; ctx.beginPath(); ctx.moveTo(0, -5); ctx.lineTo(5, 0); ctx.lineTo(0, 5); ctx.lineTo(-5, 0); ctx.closePath(); ctx.fill();
      ctx.rotate(a); ctx.strokeStyle = C.sun; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(2, 0); ctx.lineTo(10, 0); ctx.stroke(); ctx.restore();
    }
    if (p.shield > 0){ ctx.strokeStyle = C.leaf; ctx.globalAlpha = .35 + p.shield * .2; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(p.x + 2, p.y, 18, -1.15, 1.15); ctx.stroke(); ctx.globalAlpha = 1; }
  }
  for (const q of G.parts){
    ctx.globalAlpha = Math.max(0, q.l / q.m);
    if (q.ring){ ctx.strokeStyle = q.c; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(q.x, q.y, 4 + (1 - q.l / q.m) * q.R, 0, 6.283); ctx.stroke(); }
    else { ctx.fillStyle = q.c; ctx.fillRect(q.x - 1, q.y - 1, 2.5, 2.5); }
  }
  ctx.globalAlpha = 1;
  const mono = getComputedStyle(document.documentElement).getPropertyValue('--f-mono');
  ctx.textAlign = 'center'; ctx.font = '700 11px ' + mono;
  for (const s of G.texts){ ctx.globalAlpha = Math.min(1, s.l / .4); ctx.fillStyle = s.c; ctx.font = '700 ' + (s.size || 11) + 'px ' + mono; const half = ctx.measureText(s.s).width / 2 + 6; ctx.fillText(s.s, Math.max(half, Math.min(W - half, s.x)), s.y); }
  ctx.globalAlpha = 1;
  if (G.banner > 0){
    ctx.globalAlpha = Math.min(1, G.banner / .6); ctx.textAlign = 'center';
    ctx.fillStyle = C.sun; ctx.font = '700 22px ' + getComputedStyle(document.documentElement).getPropertyValue('--f-display');
    ctx.fillText(G.mcfg ? '今月のステージ' : 'STAGE ' + G.stage, W / 2, H / 2 - 8);
    ctx.font = '500 12px ' + getComputedStyle(document.documentElement).getPropertyValue('--f-body'); ctx.fillStyle = C.ink;
    ctx.fillText(G.mcfg ? G.mcfg.title + ' ・ 1機勝負' : STAGES[G.stage].sub, W / 2, H / 2 + 16); ctx.globalAlpha = 1;

    ctx.fillText(G.boss.type === 'king' ? 'FINAL BOSS' : `BOSS RUSH ${G.rushN} / 4`, W / 2, H - 14);
  }
  if (G.bossBanner > 0 && G.boss){
    ctx.globalAlpha = Math.min(1, G.bossBanner / .5) * (Math.floor(G.bossBanner * 5) % 2 ? 1 : .55); ctx.textAlign = 'center';
    ctx.fillStyle = C.coral; ctx.font = '700 14px ' + getComputedStyle(document.documentElement).getPropertyValue('--f-mono');
    ctx.fillText(G.boss.type === 'king' ? 'FINAL WARNING' : 'WARNING', W / 2, 54);
    ctx.fillStyle = C.ink; ctx.font = '700 18px ' + getComputedStyle(document.documentElement).getPropertyValue('--f-body');
    ctx.fillText('ボス「' + ((G.mcfg && G.mcfg.bossName) || BOSS_NAME[G.boss.type]) + '」', W / 2, 76); ctx.globalAlpha = 1;
  }
  if (G.hint > 0){
    ctx.globalAlpha = Math.min(1, G.hint / .5);
    ctx.fillStyle = 'rgba(6,23,34,.85)'; ctx.fillRect(W / 2 - 150, H - 58, 300, 30);
    ctx.strokeStyle = C.sun; ctx.lineWidth = 1; ctx.strokeRect(W / 2 - 150, H - 58, 300, 30);
    ctx.fillStyle = C.sun; ctx.font = '700 12px ' + getComputedStyle(document.documentElement).getPropertyValue('--f-body');
    ctx.fillText('下の POWER を押すと強化されます', W / 2, H - 38); ctx.globalAlpha = 1;

const periodLabel = k => { const d = jstNow(); if (k === 'stage'){ const m = monthlyNow(); return m ? `今月のステージ「${m.short}」の` : '今月のステージの'; } return k === 'month' ? `${d.getUTCMonth() + 1}月の本編・月間` : `${d.getUTCFullYear()}年の本編・年間`; };

const cleanName = v => String(v == null ? '' : v).replace(/[\u0000-\u001f]/g, '').trim().slice(0, 12);
async function sb(path, body){
  const headers = { apikey:CFG.supabaseKey, 'Content-Type':'application/json' };
  if (CFG.supabaseKey.startsWith('eyJ')) headers.Authorization = 'Bearer ' + CFG.supabaseKey;
  const r = await fetch(CFG.supabaseUrl.replace(/\/+$/, '') + '/rest/v1/' + path,
    body === undefined ? { headers } : { method:'POST', headers, body:JSON.stringify(body) });
  if (!r.ok) throw Object.assign(new Error('HTTP ' + r.status), { status:r.status });
  const txt = await r.text(); return txt ? JSON.parse(txt) : null;
}
// one row per registration; keep each name's best inside the period so one player does not fill the board
function topByName(rows){
  const seen = new Set(), out = [];
  for (const r of rows || []){
    const name = cleanName(r.name) || 'NO NAME', score = Number(r.score);
    if (!Number.isFinite(score) || seen.has(name)) continue;
    seen.add(name); out.push({ id:r.id, name, score }); if (out.length === 10) break;
  }
  return out;
}
async function loadBoard(force){
  if (!RANK_ON){ rankReady = true; renderBoards(); return; }
  if (!force && Date.now() - lastLoad < 15000) return;
  lastLoad = Date.now();
  try {
    const m0 = monthlyNow(), base = 'scores?select=id,name,score&order=score.desc,created_at.asc&limit=60';
    const since = k => `&created_at=gte.${encodeURIComponent(periodStart(k))}`;
    const q = (k, mode) => sb(base + since(k) + (mode && modeColumn ? `&mode=eq.${mode}` : ''));
    let m, y, s = [];
    try { [m, y, s] = await Promise.all([q('month', 'main'), q('year', 'main'), m0 ? q('month', m0.rankKey) : []]); }
    catch(e){
      if (e.status !== 400) throw e;
      // the mode column is not there yet: show every score as the main game and leave the monthly board empty
      modeColumn = false; [m, y] = await Promise.all([q('month'), q('year')]); s = [];
    }
    boards.month = topByName(m); boards.year = topByName(y); boards.stage = topByName(s); rankError = false;
  } catch(e){ rankError = true; }
  rankReady = true; renderBoards();
}
function setPeriod(p){ period = ['month','year','stage'].includes(p) ? p : 'month'; renderBoards(); }

    const stageTab = w.querySelector('[data-p="stage"]'); if (stageTab) stageTab.hidden = !monthlyNow();
    const ol = w.querySelector('.board'), note = w.querySelector('.board-note');
    ol.replaceChildren();

      const li = document.createElement('li'); if (mine.has(r.id)) li.className = 'me';
      const rk = document.createElement('span'); rk.className = 'rk'; rk.textContent = String(i + 1).padStart(2, '0');
      const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = r.name;
      const pt = document.createElement('span'); pt.className = 'pt'; pt.textContent = r.score.toLocaleString();
      li.append(rk, nm, pt); ol.appendChild(li);
    });
    let msg = '';
    if (!RANK_ON) msg = 'ランキングは準備中です。';
    else if (!rankReady) msg = 'ランキングを読み込み中…';

    else if (!board.length) msg = period === 'year' ? '今年はまだ記録がありません。' : '今月はまだ記録がありません。今月の1位を狙おう。';

function entryBlock(score){

  return `<form class="entry" data-score="${score}" data-mode="${curMode()}"><label for="nick">名前を入れて${monthly ? '今月のステージの' : '月間・年間'}ランキングに登録（12文字まで）</label><input id="nick" maxlength="12" autocomplete="nickname" placeholder="プレイヤー名"><button class="btn" type="submit">登録</button></form>`;

  'it-auto'(w, h){ const y = h / 2 + 6; fx.cap(26, y); fx.label(26, y + 22, '取る', C.sun); fx.arrow(42, y, 80, C.sun); drawLeaf(110, y, 1, false); fx.label(110, y - 18, 'MISSILE UP!', C.leaf); fx.arrow(140, y, 170); fx.cap(186, y); fx.arrow(200, y, 230, C.sun); drawLeaf(Math.min(w - 30, 258), y, 1, false); fx.label(Math.min(w - 30, 258), y - 18, 'TWIN UP!', C.leaf); },
  'it-sniper'(w, h){ const x = w * .3, y = h / 2; drawLeaf(x, y, 1, false); const tg = [{ x:w * .78, y:14 }, { x:w * .7, y:h - 12 }];
    [[x - 2, y - 20], [x - 2, y + 20]].forEach(([sx, sy], i) => { const t = tg[i], a = Math.atan2(t.y - sy, t.x - sx); ctx.save(); ctx.translate(sx, sy); ctx.fillStyle = C.sun; ctx.beginPath(); ctx.moveTo(0, -5); ctx.lineTo(5, 0); ctx.lineTo(0, 5); ctx.lineTo(-5, 0); ctx.closePath(); ctx.fill(); ctx.rotate(a); ctx.strokeStyle = C.sun; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(2, 0); ctx.lineTo(10, 0); ctx.stroke(); ctx.restore();
      fx.dots(sx + 10, sy, t.x - 10, t.y, C['leaf-hi']); fx.shot(sx + (t.x - sx) * .5, sy + (t.y - sy) * .5, a); drawEnemy({ kind:'fan', x:t.x, y:t.y, t:i }); });
    fx.label(w * .3, h - 4, '自動でねらう', C.sun); },
  'it-shield'(w, h){ const x = w * .38, y = h / 2; drawLeaf(x, y, 1, false); ctx.strokeStyle = C.leaf; ctx.globalAlpha = .95; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(x + 2, y, 18, -1.15, 1.15); ctx.stroke(); ctx.globalAlpha = 1; fx.bullet(x + 26, y - 6); fx.dots(x + 30, y - 6, w * .8, y - 18, C.coral); fx.label(w * .78, y + 18, '3回まで防ぐ', C.sun); }
};

/* ---------- loop ---------- */
let last = performance.now();
function frame(now){
  const dt = Math.min(.033, (now - last) / 1000); last = now; bgScroll += 40 * dt;
  if (G && G.state === 'play' && !G.paused) update(dt);
  draw(); hud(); tickMusic();
  requestAnimationFrame(frame);
}
resize(); updatePanel(); showTitle(); requestAnimationFrame(frame); loadBoard(true);
})();
</script>
