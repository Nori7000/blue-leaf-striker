<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one-screen game. Play field fills the top, power gauge docks below like a console strip. */
:root{
  --sea:#061722;      /* open water background */
  --deep:#0a2433;     /* panels */
  --reef:#0f3a4a;     /* terrain fill */
  --edge:#3a9db0;     /* terrain contour */
  --leaf:#5cc8ff;     /* player ship, primary accent */
  --leaf-hi:#d2f2ff;
  --coral:#ff7a6b;    /* enemies */
  --sun:#ffc75a;      /* capsules, gauge */
  --ink:#e7f3f7;
  --mute:#8fb3bf;
  --line:rgba(143,179,191,.22);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html{box-sizing:border-box;height:100%;background:var(--sea)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--sea);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px;touch-action:none;cursor:crosshair}
#screen{position:relative;max-width:100%}
canvas{display:block;border-radius:6px;outline:1px solid var(--line)}
#hud{position:absolute;inset:0 0 auto 0;display:flex;align-items:center;gap:14px;padding:8px 10px;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink);pointer-events:none}
#hud .lbl{color:var(--mute);font-size:10px;letter-spacing:.1em;margin-right:4px}
#hud .sp{flex:1}
#hud > span{white-space:nowrap}
@media (max-width:460px){#hud{gap:9px;font-size:11px}#hud .lbl{margin-right:2px}#topWrap{display:none!important}}
#hud button{pointer-events:auto;width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:rgba(10,36,51,.7);color:var(--ink);font:500 12px var(--f-mono);cursor:pointer}
#hud button:focus-visible,.btn:focus-visible,#power:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
#panel{flex:none;display:flex;gap:10px;align-items:stretch;padding:10px 16px;border-top:1px solid var(--line);background:var(--deep);touch-action:none}
#gauge{flex:1;min-width:0;display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.cell{border:1px solid var(--line);border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:10px;letter-spacing:.03em;color:var(--mute);min-height:42px;text-align:center;padding:2px;overflow:hidden;transition:background .12s,color .12s}
.cell.on{background:var(--sun);border-color:var(--sun);color:var(--sea)}
.cell.max{opacity:.35}
.cell .s{display:none}
@media (max-width:520px){.cell .l{display:none}.cell .s{display:inline}#power{width:84px}}
.mode{display:flex;flex-direction:column;gap:6px}
.ships{display:flex;flex-direction:column;gap:6px}
.result{display:flex;gap:14px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(10,36,51,.6)}
.result .grade{font:700 40px var(--f-display);width:56px;height:56px;display:grid;place-items:center;border-radius:10px;border:2px solid currentColor}
.result .gS{color:var(--sun)}.result .gA{color:var(--leaf)}.result .gB{color:var(--ink)}.result .gC{color:var(--mute)}
.result small{display:block;font:500 11px var(--f-mono);color:var(--mute);letter-spacing:.08em}.result b{font:700 26px var(--f-mono)}.result b span{font-size:13px;margin-left:2px}
.result p{margin:2px 0 0;font-size:12px;color:var(--mute)}.result em{color:var(--sun);font-style:normal;font-weight:700}
.ship-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:520px}
.ship-card{display:flex;flex-direction:column;gap:4px;text-align:left;padding:8px;border-radius:10px;border:1px solid var(--line);background:rgba(10,36,51,.6);color:var(--ink);cursor:pointer;font:inherit}
.ship-card[aria-pressed="true"]{border-color:var(--sun);box-shadow:0 0 0 2px var(--sun) inset}
.ship-card canvas{width:100%;height:54px;border-radius:6px;pointer-events:none}
.ship-card b{font:700 14px var(--f-display);letter-spacing:.06em;display:flex;gap:8px;align-items:baseline}.ship-card b small{font:500 11px var(--f-body);color:var(--mute)}
.ship-card span{font-size:12px;color:var(--mute);line-height:1.5}
.cmp{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.cmp-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp-pair figure{margin:0;display:flex;flex-direction:column;gap:4px;min-width:0}
.cmp-pair canvas{width:100%;height:70px;border-radius:5px}
.cmp-pair figcaption{font-size:12px;line-height:1.5;color:var(--ink)}
.cmp-pair figcaption b{display:block;font:700 11px var(--f-mono);letter-spacing:.06em}.cmp-pair b.leaf{color:var(--leaf)}.cmp-pair b.lance{color:#ffd27a}
.ship-fx{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:4px 0 0;font-size:12px}.ship-fx dt{font:700 11px var(--f-mono);color:var(--sun)}.ship-fx dd{margin:0;color:var(--ink)}
.mode-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mode-row .lbl{font:500 11px var(--f-mono);letter-spacing:.12em;color:var(--mute)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--mute);padding:8px 16px;font:700 13px var(--f-mono);letter-spacing:.06em;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--leaf);color:var(--sea)}
.seg button:focus-visible{outline:2px solid var(--sun);outline-offset:-2px}
.mode-desc{margin:0;font-size:13px;color:var(--mute);line-height:1.6}
.monthly{display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--sun);border-radius:10px;background:rgba(255,199,90,.06)}
.monthly h3{margin:0;font:700 18px var(--f-body)}
.monthly p{margin:0;font-size:13px;line-height:1.6;color:var(--mute)}
.monthly .rule{color:var(--ink)}
#power{flex:none;width:100px;border:0;border-radius:8px;background:var(--leaf);color:var(--sea);font:700 13px var(--f-display);letter-spacing:.06em;cursor:pointer}
#power:disabled{background:var(--reef);color:var(--mute);cursor:default}
#power{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.1}
#power small{font:500 10px var(--f-mono);letter-spacing:.04em}
#power.ready{animation:ready 1s ease-in-out infinite;box-shadow:0 0 0 0 rgba(92,200,255,.6)}
@keyframes ready{50%{box-shadow:0 0 0 6px rgba(92,200,255,0)}}
#gauge{cursor:pointer}
@media (prefers-reduced-motion:reduce){#power.ready{animation:none}}
#overlay{position:fixed;inset:0;z-index:5;display:flex;align-items:flex-start;justify-content:center;padding:16px;background:rgba(6,23,34,.78);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);overflow:auto}
.card{width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px;margin:auto}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--sun)}
.logo{font:700 clamp(28px,8vw,44px)/1.02 var(--f-display);letter-spacing:-.01em;text-wrap:balance;margin:0}
.logo span{color:var(--leaf)}
.lead{font-size:14px;line-height:1.7;color:var(--mute);margin:0}
.how{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0;font-size:14px;line-height:1.55}
.how dt{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;color:var(--sun);padding-top:4px}
.how dd{margin:0}
.big{font:700 clamp(24px,7vw,36px)/1.1 var(--f-display);margin:0}
.score{display:flex;gap:24px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.score div{display:flex;flex-direction:column;gap:2px}
.score small{font-size:10px;letter-spacing:.12em;color:var(--mute)}
.score b{font-size:22px;font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.install-tip{margin:0;padding:8px 12px;border:1px solid var(--line, rgba(140,200,220,.3));border-radius:10px;font-size:12.5px;line-height:1.6;max-width:520px}
.btn{border:0;border-radius:8px;padding:13px 22px;background:var(--leaf);color:var(--sea);font:700 14px var(--f-body);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.studio{font-size:13px;color:var(--mute);border-top:1px solid var(--line);padding-top:12px;line-height:1.6}
.studio a{color:var(--leaf);text-decoration:none;font-weight:700}
.studio a:hover{text-decoration:underline}
.tut-tabs{display:flex;gap:6px;flex-wrap:wrap}
.tut-tabs button{border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:999px;padding:6px 12px;font:500 12px var(--f-body);cursor:pointer}
.tut-tabs button[aria-current="true"]{background:var(--sun);border-color:var(--sun);color:var(--sea)}
.tut-list{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:620px){.tut-list.two{grid-template-columns:1fr 1fr}}
.tut-item{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:8px;padding:10px;background:rgba(10,36,51,.6);min-width:0}
.tut-item canvas{width:100%;height:76px;border-radius:5px;outline:none}
.tut-item h3{margin:0;font:700 14px var(--f-body);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tut-item h3 small{font:500 11px var(--f-mono);color:var(--sun);letter-spacing:.06em}
.tut-item p{margin:0;font-size:13px;line-height:1.6;color:var(--mute)}
.tut-flow canvas{height:104px}
.tut-note{margin:0;padding:10px 12px;border-left:3px solid var(--sun);background:rgba(255,199,90,.08);font-size:13px;line-height:1.7}
.board-wrap{display:flex;flex-direction:column;gap:8px}
.board-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.seg-sm button{padding:5px 12px;font-size:12px}
.board-period{margin:0;font-size:12px;color:var(--mute)}
.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.board li{display:grid;grid-template-columns:2.2em 1fr auto auto;gap:10px;align-items:baseline;padding:7px 2px;border-bottom:1px solid var(--line);font-size:14px}
.board .rk{font-family:var(--f-mono);font-size:11px;color:var(--mute)}
.board li:first-child .rk{color:var(--sun)}
.board .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .pt{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.board .tags{display:flex;gap:4px;align-self:center}
.board .tg{font:600 10px var(--f-mono);letter-spacing:.04em;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--mute)}
.board .tg.leaf{color:var(--leaf);border-color:var(--leaf)}.board .tg.lance{color:#ffd27a;border-color:#ffd27a}
@media (max-width:380px){.board .tg.it{display:none}}
.board li.me{background:rgba(92,200,255,.1)}
.board li.me .nm::after{content:"  あなた";color:var(--leaf);font-size:11px}
.board-note{font-size:13px;color:var(--mute);margin:0;line-height:1.6}
.entry{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.entry label{width:100%;font-size:13px;color:var(--mute)}
.entry input{flex:1;min-width:0;padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:var(--deep);color:var(--ink);font:500 15px var(--f-body)}
.entry input:focus-visible{outline:2px solid var(--sun);outline-offset:1px}
@media (max-height:520px){.card{gap:10px}.logo{font-size:26px}.lead{display:none}.how{font-size:13px;gap:4px 12px}}
@media (prefers-reduced-motion:reduce){.cell{transition:none}}
</style>

<div id="app">
  <div id="stage">
    <div id="screen">
      <canvas id="cv" aria-label="ゲーム画面"></canvas>
      <div id="hud">
        <span><span class="lbl">SCORE</span><span id="sc">0</span></span>
        <span><span class="lbl">HI</span><span id="hi">0</span></span>
        <span><span class="lbl">ST</span><span id="st">1</span></span>
        <span><span class="lbl">残機</span><span id="lv">2</span></span>
        <span id="topWrap" hidden><span class="lbl">TOP</span><span id="top"></span></span>
        <span class="sp"></span>
        <button id="mute" type="button" aria-label="音のオン・オフ">♪</button>
        <button id="pause" type="button" aria-label="一時停止">II</button>
      </div>
    </div>
  </div>
  <div id="panel">
    <div id="gauge" aria-label="パワーアップゲージ"></div>
    <button id="power" type="button" disabled><span>POWER</span><small id="powerItem"></small></button>
  </div>
</div>
<div id="overlay"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const cv = $('#cv'); let ctx = cv.getContext('2d'); const stage = $('#stage'), screenEl = $('#screen'), overlay = $('#overlay');
const css = getComputedStyle(document.documentElement);
const C = {}; ['sea','deep','reef','edge','leaf','leaf-hi','coral','sun','ink','mute'].forEach(k => C[k] = css.getPropertyValue('--' + k).trim());
const H = 360; let W = 640, scale = 1;
const ITEMS = {
  SPEED:   { short:'SPD', can:p => p.spd < SHIPS[p.ship].spdMax, auto:p => p.spd < SHIPS[p.ship].spdMax, apply:p => p.spd++ },
  MISSILE: { short:'MIS', can:p => !p.missile,         auto:p => !p.missile,          apply:p => p.missile = true },
  TWIN:    { short:'TWN', can:p => p.weapon !== 't',   auto:p => p.weapon === 'n',    apply:p => p.weapon = 't' },
  BEAM:    { short:'BEM', can:p => p.weapon !== 'b',   auto:p => p.weapon === 'n',    apply:p => p.weapon = 'b' },
  DRONE:   { short:'DRN', can:p => p.opts < 2,         auto:p => p.opts < 2,          apply:p => p.opts++ },
  SNIPER:  { short:'SNP', can:p => p.snipers < 2,      auto:p => p.snipers < 2,       apply:p => p.snipers++ },
  SHIELD:  { short:'SHD', can:p => p.shield <= 0,      auto:p => p.shield <= 0,       apply:p => p.shield = SHIPS[p.ship].shield }
};
const gaugeList = stg => stg >= 2 ? ['SPEED','MISSILE','TWIN','BEAM','DRONE','SNIPER','SHIELD'] : ['SPEED','MISSILE','TWIN','BEAM','DRONE','SHIELD'];
let GAUGE = gaugeList(1);
let itemMode = 'auto';
const STUDIO_URL = 'https://blue-leaf-studio.blog/';
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };
let hi = +store.get('bls_hi') || 0;
itemMode = store.get('bls_mode') === 'manual' ? 'manual' : 'auto';
/* two ships: same items, different effects. labels rename an item on the panel for that ship */
const SHIPS = {
  leaf: { name:'LEAF', jp:'リーフ', desc:'連射とつらぬく攻撃が得意。ザコの群れに強く、守りも固い。',
          spdBase:120, spdStep:38, spdMax:4, shield:4, labels:{},
          fx:{ SPEED:'4段階・細かく調整できる', MISSILE:'下へ1発・速い間隔で連射、床を走る', TWIN:'前と斜め上の2方向・速い連射', BEAM:'並んだ敵をまとめてつらぬく', DRONE:'後ろをついてくる子機（最大2）', SNIPER:'近い敵をねらう速い弾（最大2）', SHIELD:'4回まで防ぐ' } },
  lance:{ name:'LANCE', jp:'ランス', desc:'広い範囲と一撃の重さが得意。ボスや硬い敵に強いが、連射は遅め。',
          spdBase:108, spdStep:50, spdMax:3, shield:2, labels:{ TWIN:'WIDE', BEAM:'LASER', DRONE:'WING' },
          fx:{ SPEED:'3段階・1段の伸びが大きい', MISSILE:'上下2発（1発は軽め）、天井も床も走る', WIDE:'翼の先から前方3方向・連射は遅め', LASER:'長く重いレーザー（2倍の威力・つらぬかない・連射は遅い）', WING:'上下に並んで飛ぶ僚機（最大2）', SNIPER:'重い弾をゆっくり撃つ（2倍の威力）', SHIELD:'2回まで防ぐ・防ぐたびに周りの敵弾を消す' } }
};
let shipId = store.get('bls_ship') === 'lance' ? 'lance' : 'leaf';
const ship = () => SHIPS[(G && G.ship) || shipId];
const itemName = n => ship().labels[n] || n;
// ranking row tags: which ship and which item mode the score was made with (older scores have neither)
function rankTags(r){
  const t = document.createElement('span'); t.className = 'tags';
  if (SHIPS[r.ship]){ const a = document.createElement('span'); a.className = 'tg ' + r.ship; a.textContent = SHIPS[r.ship].name; t.appendChild(a); }
  if (r.items === 'auto' || r.items === 'manual'){ const b = document.createElement('span'); b.className = 'tg it'; b.textContent = r.items === 'auto' ? 'AUTO' : 'MANUAL'; t.appendChild(b); }
  return t;
}

/* ---------- layout ---------- */
function resize(){
  const r = stage.getBoundingClientRect();
  const aw = r.width - 16, ah = r.height - 16;
  if (aw < 50 || ah < 50) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.round(Math.max(420, Math.min(760, H * aw / ah)));
  let cw = aw, ch = cw * H / W;
  if (ch > ah){ ch = ah; cw = ch * W / H; }
  screenEl.style.width = cw + 'px'; screenEl.style.height = ch + 'px';
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  scale = cv.width / W;
}
addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);

/* ---------- audio ---------- */
let ac = null, muted = false;
function initAudio(){ if (ac) { ac.resume && ac.resume(); return; } try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
function tone(f, dur, type='square', vol=.05, slide=0){
  if (!ac || muted) return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur);
}
function noise(dur, vol=.12){
  if (!ac || muted) return;
  const n = Math.floor(ac.sampleRate * dur), b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
  s.buffer = b; g.gain.value = vol; f.type = 'lowpass'; f.frequency.value = 1400;
  s.connect(f).connect(g).connect(ac.destination); s.start();
}
/* BGM: one <audio> element for every track, so phones that unlock it on the first tap keep allowing track changes */
const TRACKS = {
  title: { src:'music/title.mp3', loop:[0, 181],   vol:.45 },
  stage: { src:'music/stage.mp3', loop:[2, 155.5], vol:.4 },   // stages 1-2
  stage3:{ src:'music/stage3.mp3', loop:[3, 180], vol:.4 },    // Sunken Hull
  stage4:{ src:'music/stage4.mp3', loop:[5.5, 187.5], vol:.4 }, // Vent Pressure
  stage5:{ src:'music/stage5.mp3', loop:[2.5, 177.5], vol:.4 }, // Abyss Throne
  boss:  { src:'music/boss.mp3',  loop:[0, 106.5], vol:.45 },
  clear: { src:'music/clear.mp3', vol:.6 },

  if (p.shield > 0){
    p.shield--; p.inv = .6; sfx.hit(); updatePanel(); if (inBoss()) G.bossHits++;
    G.hurt = { t:1.1, m:1.1, n:p.shield, max:SHIPS[p.ship].shield }; G.shake = Math.max(G.shake, .3); burst(p.x, p.y, '#ff6a5a', 14, .8);
    if (p.ship === 'lance'){ for (const b of G.eb) if (d2(b, p) < 70 * 70){ b.dead = true; burst(b.x, b.y, '#ffd27a', 3, .4); } G.shake = .2; G.ring = { x:p.x, y:p.y, at:performance.now() }; }
    return;
  }
  killPlayer();
}
function updatePlayer(dt){
  const p = G.p; p.inv = Math.max(0, p.inv - dt);
  const S = SHIPS[p.ship], sp = S.spdBase + p.spd * S.spdStep; let mx = 0, my = 0;
  if (keys.arrowleft || keys.a) mx--; if (keys.arrowright || keys.d) mx++;
  if (keys.arrowup || keys.w) my--;   if (keys.arrowdown || keys.s) my++;
  if (mx || my){ const l = Math.hypot(mx, my); p.x += mx / l * sp * dt; p.y += my / l * sp * dt; }
  const sw = swimCfg();
  if (sw && !(G.boss && G.bossDead)){
    p.y += sw.sink * dt; p.x += sw.current * dt;
    if (Math.random() < dt * 4) G.parts.push({ bubble:true, x:p.x - 14, y:p.y - 2, vx:-20, vy:-30, l:1.2, m:1.2, c:'#d2f2ff' });
  }
  clampP();
  const last = p.hist[p.hist.length - 1];
  if (!last || Math.abs(last.x - p.x) + Math.abs(last.y - p.y) > 1){ p.hist.push({ x:p.x, y:p.y }); if (p.hist.length > 40) p.hist.shift(); }
  fire(dt);
  const wx = p.x + G.scroll, cy = ceilY(wx), fy = floorY(wx);
  if (p.inv <= 0 && G.boss && G.boss.gate && zapLive(G.boss) && Math.abs(p.y - G.boss.zap.y) < 8 && p.x < zapEnd(G.boss)){ killPlayer(); return; }
  if (p.inv <= 0) for (const g of G.gates){ if (gateOn(g) && Math.abs(p.x - g.x) < 9 && g.x < W){ killPlayer(); return; } }
  if (p.inv <= 0) for (const v of G.vents){ const c = ventColumn(v); if (c && Math.abs(p.x - v.x) < 13 && p.y > c.y0 - 4 && p.y < c.y1 + 4){ killPlayer(); return; } }
  for (const k of G.blocks){
    if (k.dead || Math.abs(p.x - k.x) > 11 || Math.abs(p.y - k.y) > 11) continue;
    if (p.inv > 0){ p.x = k.x - 12; clampP(); } else { killPlayer(); return; }
  }
  const wg = wedgeAt(wx);
  if (wg && p.y + 5 > wg.top && p.y - 5 < wg.bot){ if (p.inv > 0) p.y = p.y < wg.yc ? wg.top - 6 : wg.bot + 6; else { killPlayer(); return; } }
  if (p.y - 5 < cy || p.y + 5 > fy){
    if (p.inv > 0) p.y = Math.max(cy + 6, Math.min(fy - 6, p.y));
    else killPlayer();
  }
}

/* ---------- boss ---------- */
/* how much of the boss is left (core + every breakable part), 1 = untouched */
function bossLife(b){
  let v = Math.max(0, b.hp);
  for (const a of [b.plates, b.cannons, b.segs, b.gems, b.tips, b.lures]) if (a) for (const x of a) v += Math.max(0, typeof x === 'number' ? x : x.hp);
  return v;
}
function updateBoss(dt){
  const b = G.boss; if (!b || b.dead) return;
  // anger: the more damage it has taken, the faster it moves and fires (up to 1.8x), with a warning flash at half and a quarter
  if (b.life0 == null) b.life0 = bossLife(b) || 1;
  const left = bossLife(b) / b.life0, stage = left < .25 ? 2 : left < .5 ? 1 : 0;
  if (stage > (b.anger || 0)){ b.anger = stage; G.shake = .4; floatText(b.x - 30, b.y - 40, stage === 2 ? 'RAGE!!' : 'ANGER!', C.coral); sfx.die(); }
  dt *= 1 + (b.gate ? .3 : .8) * (1 - left);
  if (b.type === 'jelly') return updateJelly(b, dt);
  if (b.type === 'worm') return updateWorm(b, dt);
  if (b.type === 'king') return updateKing(b, dt);
  if (b.type === 'kraken') return updateKraken(b, dt);
  if (b.type === 'angler') return updateAngler(b, dt);
  if (b.type === 'fort') return updateFort(b, dt);
  b.t += dt; b.x += (W - 120 - b.x) * Math.min(1, dt * 1.2); b.y = H / 2 + (b.mk >= 2 ? 95 : 80) * Math.sin(b.t * (b.mk >= 2 ? 1 : .8));
  if (b.mk === 3 && b.x < W - 60){ b.call -= dt; if (b.call <= 0){ b.call = 5; spawn('rear'); } }
  b.flash = Math.max(0, b.flash - dt); b.cd -= dt;
  if (b.cd <= 0 && b.x < W - 60){
    b.vol++; b.cd = b.mk === 2 ? 1.05 : b.mk === 3 ? 1.2 : 1.3; const cx = b.x - 54, sp = b.mk === 2 ? 3 : 2;
    if (b.vol % 3 === 0) for (let k = -1; k <= 1; k++) aim(b.x - (k ? 90 : 55), b.y + k * 48, 170); // the two gun arms and the channel
    else for (let k = -sp; k <= sp; k++){ const a = Math.PI + k * .22; G.eb.push({ x:cx, y:b.y, vx:Math.cos(a) * 150, vy:Math.sin(a) * 150 }); }
  }
}
function shotVsBoss(s){
  const b = G.boss; if (!b || b.dead || b.x > W + 40) return;
  if (b.type === 'jelly') return shotVsJelly(b, s);
  if (b.type === 'worm') return shotVsWorm(b, s);
  if (b.type === 'king') return shotVsKing(b, s);
  if (b.type === 'kraken') return shotVsKraken(b, s);
  if (b.type === 'angler') return shotVsAngler(b, s);
  if (b.type === 'fort') return shotVsFort(b, s);
  for (let i = 0; i < b.plates.length; i++){
    if (b.plates[i] <= 0) continue;
    const px = plateX(b, i);
    const reach = s.k === 'b' ? s.x - s.len <= px + 3 : s.x <= px + 11;
    if (s.x >= px - 3 && reach && Math.abs(s.y - b.y) <= 17){
      s.dead = true; b.plates[i]--; b.flash = .06; sfx.hit();
      if (b.plates[i] <= 0){ burst(px, b.y, C.edge, 16, 1); G.score += 500; sfx.small(); }
      return;
    }
  }
  const cx = b.x, dx = s.x - cx, dy = s.y - b.y;
  const coreHit = s.k === 'b' ? (Math.abs(dy) < 12 && s.x >= cx - 10 && s.x - s.len <= cx + 10) : dx * dx + dy * dy < 13 * 13;
  if (coreHit){
    s.dead = true;
    if (b.plates.every(v => v <= 0)){ b.hp -= dmgOf(s); b.flash = .08; sfx.hit(); if (b.hp <= 0) killBoss(); }
    return;
  }
  // the machine soaks up shots, except along the open channel that leads to the core
  const inChannel = Math.abs(dy) < 17 && s.x < cx;
  if ((dx * dx + dy * dy < 65 * 65 && !inChannel) || coreArms(b).some(q => d2(s, q) < 22 * 22)) s.dead = true;
}
function hitBlock(k, dmg){
  k.hp -= dmg; sfx.hit();
  if (k.hp <= 0){
    k.dead = true; G.score += 20; burst(k.x, k.y, k.chest ? C.sun : terrCol('edge'), 6, .6); if (k.chest) dropCap(k.x, k.y);
    floatText(k.x, k.y - 6, '+20', C.ink, .6, 9);
    const wl = G.walls[k.w];
    if (wl && !wl.lost && ++wl.k === wl.n){ G.score += 1000; sfx.power(); G.shake = .25; floatText(W / 2, H / 2 - 30, 'WALL CLEAR +1000', C.sun, 1.8, 16); }
  }
}
function shotVsBlocks(s){
  for (const k of G.blocks){
    if (k.dead || Math.abs(s.y - k.y) > 8) continue;
    const inX = s.k === 'b' ? s.x >= k.x - 7 && s.x - s.len <= k.x + 7 : Math.abs(s.x - k.x) <= 9;
    if (!inX) continue;
    s.dead = true; hitBlock(k, dmgOf(s)); return;
  }
}


/* ---------- STAGE 4: hydrothermal vents ---------- */
const VENT_CYCLE = 4.2;
function ventState(v){
  const ph = (G.t + v.off) % VENT_CYCLE;
  return ph < 2.2 ? { phase:'idle', ph } : ph < 3 ? { phase:'warn', ph:ph - 2.2 } : { phase:'erupt', ph:ph - 3 };
}
const ventBase = v => v.top ? ceilY(v.wx) + 14 : floorY(v.wx) - 14;
function ventColumn(v){
  const st = ventState(v); if (st.phase !== 'erupt') return null;
  const base = ventBase(v), span = (floorY(v.wx) - ceilY(v.wx)) * .78, len = span * Math.min(1, st.ph / .22) * (st.ph > 1 ? Math.max(0, (1.2 - st.ph) / .2) : 1);
  return v.top ? { y0:base, y1:base + len } : { y0:base - len, y1:base };
}
function drawVent(v){
  const dir = v.top ? 1 : -1, b = v.top ? ceilY(v.wx) : floorY(v.wx), st = ventState(v), x = v.x;
  // chimney
  ctx.fillStyle = '#3a1d16'; ctx.strokeStyle = '#ff8a3d'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x - 15, b); ctx.lineTo(x - 8, b + dir * 14); ctx.lineTo(x + 8, b + dir * 14); ctx.lineTo(x + 15, b); ctx.closePath(); ctx.fill(); ctx.stroke();
  const mouth = b + dir * 14;
  if (st.phase === 'warn'){
    ctx.fillStyle = '#ff8a3d'; ctx.globalAlpha = .5 + .5 * Math.sin(st.ph * 30);
    ctx.beginPath(); ctx.arc(x, mouth, 7, 0, 6.283); ctx.fill(); ctx.globalAlpha = 1;
    ctx.strokeStyle = 'rgba(255,199,90,.7)'; ctx.lineWidth = 1;
    for (let i = 0; i < 3; i++){ const yy = mouth + dir * (8 + ((st.ph * 60 + i * 14) % 40)); ctx.beginPath(); ctx.arc(x + (i - 1) * 6, yy, 2.5, 0, 6.283); ctx.stroke(); }
  }
  const c = ventColumn(v);
  if (c){
    const g = ctx.createLinearGradient(x - 12, 0, x + 12, 0);
    g.addColorStop(0, 'rgba(255,138,61,0)'); g.addColorStop(.5, 'rgba(255,199,90,.95)'); g.addColorStop(1, 'rgba(255,138,61,0)');
    ctx.fillStyle = g; ctx.fillRect(x - 12, c.y0, 24, c.y1 - c.y0);
    ctx.fillStyle = 'rgba(255,240,210,.9)'; ctx.fillRect(x - 3, c.y0, 6, c.y1 - c.y0);
  }
}

/* ---------- boss 4: ヒートワーム (sea worm; only the head takes damage, body segments block shots) ---------- */
// body segments sit every 22px along the path the head has travelled
/* the body is a chain of glowing armour rings: one at every segment and one halfway to the next, both belonging to that segment */
const WORM_GAP = 34;
function wormRings(b){
  const segs = wormSegs(b), out = [];
  segs.forEach((g, i) => {
    const p = i ? segs[i - 1] : b; // the neighbour toward the head
    out.push({ x:(g.x + p.x) / 2, y:(g.y + p.y) / 2, a:Math.atan2(p.y - g.y, p.x - g.x), s:g.s });
    out.push({ x:g.x, y:g.y, a:Math.atan2(p.y - g.y, p.x - g.x), s:g.s });
  });
  return out;
}
function wormSegs(b){
  const out = [], H0 = b.hist; let need = WORM_GAP, acc = 0, i = H0.length - 1, px = b.x, py = b.y;
  while (out.length < b.segs.length && i >= 0){
    const q = H0[i], d = Math.hypot(q.x - px, q.y - py);
    if (acc + d >= need){ const f = (need - acc) / d; px += (q.x - px) * f; py += (q.y - py) * f; out.push({ x:px, y:py, s:b.segs[out.length], i:out.length }); acc = 0; continue; }
    acc += d; px = q.x; py = q.y; i--;
  }
  while (out.length < b.segs.length) out.push({ x:px + (out.length + 1) * 4, y:py, s:b.segs[out.length], i:out.length });
  return out;
}
function updateWorm(b, dt){
  b.t += dt; b.flash = Math.max(0, b.flash - dt);
  const tx = W * .6 + W * .22 * Math.cos(b.t * .7), ty = H / 2 + 105 * Math.sin(b.t * 1.4);
  b.x += (tx - b.x) * Math.min(1, dt * 1.6); b.y += (ty - b.y) * Math.min(1, dt * 1.6);
  b.hist.push({ x:b.x, y:b.y }); if (b.hist.length > 600) b.hist.shift();
  b.cd -= dt;
  if (b.cd <= 0 && b.x < W - 30 && G.p){
    b.cd = 1.5; const a = Math.atan2(G.p.y - b.y, G.p.x - b.x);
    for (let k = -1; k <= 1; k++) G.eb.push({ x:b.x, y:b.y, vx:Math.cos(a + k * .25) * 160, vy:Math.sin(a + k * .25) * 160 });
  }
}
function shotVsWorm(b, s){
  const hit = (x, y, r) => s.k === 'b' ? Math.abs(s.y - y) < r && s.x >= x - r && s.x - s.len <= x + r : d2(s, { x, y }) < r * r;
  if (hit(b.x, b.y, 22)) return damageBoss(b, s, dmgOf(s));
  for (const g of wormRings(b)){
    if (g.s.hp <= 0 || !hit(g.x, g.y, 14)) continue;
    s.dead = true; g.s.hp -= dmgOf(s); b.flash = .03; sfx.hit();
    if (g.s.hp <= 0){ burst(g.x, g.y, '#ff8a3d', 12, .8); G.score += 200; floatText(g.x, g.y - 10, '+200', C.ink, .8, 10); }
    return;
  }
}
/* Heat Worm, drawn from Blue Leaf's concept art (img/heatworm.webp: head | ring | tail). Falls back to the old shapes if the
   image is missing. Broken rings go dark; the head's jaws always turn toward the ship. */
const WORM_IMG = new Image(); WORM_IMG.src = 'img/heatworm.webp';
const WORM_K = .155; // art pixels -> game pixels
function wormDark(){
  if (artCache.wormDark) return artCache.wormDark;
  const c = document.createElement('canvas'); c.width = 130; c.height = 248; const x = c.getContext('2d');
  x.drawImage(WORM_IMG, 504, 0, 130, 248, 0, 0, 130, 248); x.globalCompositeOperation = 'source-atop'; x.fillStyle = 'rgba(20,10,8,.78)'; x.fillRect(0, 0, 130, 248);
  return artCache.wormDark = c;
}
function drawWormSprite(b){
  const k = WORM_K, rings = wormRings(b), im = WORM_IMG, now = performance.now() / 1000;
  const glow = (fn) => { fn(); if (b.flash > 0){ ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = .45; fn(); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; } };
  // tail spike at the end of the chain, pointing away from the body
  const L = rings[rings.length - 1], P = rings[rings.length - 2] || b;
  ctx.save(); ctx.translate(L.x, L.y); ctx.rotate(Math.atan2(L.y - P.y, L.x - P.x) + 2.37); ctx.scale(k, k);
  ctx.drawImage(im, 638, 0, 195, 225, -180, -175, 195, 225); ctx.restore();
  for (let i = rings.length - 1; i >= 0; i--){
    const g = rings[i]; ctx.save(); ctx.translate(g.x, g.y); ctx.rotate(g.a); ctx.scale(k, k);
    if (g.s.hp <= 0){ ctx.scale(.86, .86); ctx.drawImage(wormDark(), -65, -124); } // a broken ring, burnt out and shrunk
    else glow(() => ctx.drawImage(im, 504, 0, 130, 248, -65, -124, 130, 248));
    ctx.restore();
  }
  // head: jaws toward the ship (mirrored rather than upside down when it looks right)
  const a = G && G.p ? Math.atan2(G.p.y - b.y, G.p.x - b.x) : Math.PI, right = Math.cos(a) > 0;
  ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(a + Math.PI); if (right) ctx.scale(1, -1);
  const breathe = 1 + .03 * Math.sin(now * 6); ctx.scale(k * breathe, k);
  glow(() => ctx.drawImage(im, 0, 0, 500, 420, -235, -222, 500, 420)); // the glowing throat sits on b.x, b.y, where shots come from
  ctx.restore();
}
function drawWorm(b){
  if (WORM_IMG.complete && WORM_IMG.naturalWidth) return drawWormSprite(b);
  const segs = wormSegs(b);
  for (let i = segs.length - 1; i >= 0; i--){
    const g = segs[i]; if (g.s.hp <= 0){ ctx.fillStyle = 'rgba(255,138,61,.15)'; ctx.beginPath(); ctx.arc(g.x, g.y, 5, 0, 6.283); ctx.fill(); continue; }
    const r = 13 - i * .4;
    ctx.fillStyle = '#3a1d16'; ctx.strokeStyle = b.flash > 0 ? C.ink : '#ff8a3d'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(g.x, g.y, r, 0, 6.283); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ff8a3d'; ctx.globalAlpha = .35 + .35 * (g.s.hp / 4); ctx.beginPath(); ctx.arc(g.x, g.y, r * .45, 0, 6.283); ctx.fill(); ctx.globalAlpha = 1;
  }
  // head: jaws open toward the ship
  const a = G && G.p ? Math.atan2(G.p.y - b.y, G.p.x - b.x) : Math.PI;
  ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(a);
  ctx.fillStyle = b.flash > 0 ? C.ink : C.coral; ctx.beginPath(); ctx.arc(0, 0, 17, .5, 6.283 - .5); ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();
  ctx.fillStyle = C.sun; ctx.beginPath(); ctx.arc(-4, -7, 3, 0, 6.283); ctx.arc(-4, 7, 3, 0, 6.283); ctx.fill();
  ctx.restore();
}


/* ---------- STAGE 5 final boss: 深海の王, a Medusa of machine snakes (destroy three snake heads, then the opened mouth; dodge the telegraphed laser) ---------- */
const kingMouth = b => ({ x:b.x - 58, y:b.y + 8 });
const kingOpen = b => b.gems.every(g => g.hp <= 0);
function updateKing(b, dt){
  b.t += dt; b.flash = Math.max(0, b.flash - dt);
  b.x += (W - 96 - b.x) * Math.min(1, dt * .8); b.y = H / 2 + 6 + 22 * Math.sin(b.t * .55);
  if (b.x > W - 40) return;

  b.call -= dt; if (b.call <= 0){ b.call = open ? 5 : 7; spawn('rear'); }
  if (open){ b.rcd -= dt; if (b.rcd <= 0){ b.rcd = 2.4; for (let k = 0; k < 12; k++){ const a = k / 12 * 6.283 + b.t; G.eb.push({ x:m.x, y:m.y, vx:Math.cos(a) * 120, vy:Math.sin(a) * 120 }); } } }
  // laser: a thin warning line at the ship's height, then a thick beam across the screen
  if (!b.laser){ b.lcd -= dt; if (b.lcd <= 0 && G.p){ b.laser = { y:G.p.y, t:0 }; sfx.hit(); } }
  else {
    b.laser.t += dt;
    if (b.laser.t > 1.9){ b.laser = null; b.lcd = open ? 3.2 : 4.5; }
    else if (b.laser.t > 1 && G.p && G.p.inv <= 0 && Math.abs(G.p.y - b.laser.y) < 10 && G.p.x < m.x) hurtPlayer();
  }
}
function shotVsKing(b, s){
  const hit = (x, y, r) => s.k === 'b' ? Math.abs(s.y - y) < r && s.x >= x - r && s.x - s.len <= x + r : d2(s, { x, y }) < r * r;
  for (const g of b.gems){
    if (g.hp <= 0 || !hit(b.x + g.dx, b.y + g.dy, 16)) continue;
    s.dead = true; g.hp -= dmgOf(s); b.flash = .05; sfx.hit();
    if (g.hp <= 0){ burst(b.x + g.dx, b.y + g.dy, '#ff4a5a', 26, 1.2); G.score += 1500; floatText(b.x + g.dx, b.y + g.dy - 14, '+1500', C.sun, 1, 12); if (kingOpen(b)) floatText(W / 2, H / 2 - 50, '口が開いた！', C.coral, 1.6, 16); }
    return;
  }
  const m = kingMouth(b);
  if (kingOpen(b) && hit(m.x, m.y, 15)) return damageBoss(b, s, dmgOf(s));
  const toMouth = Math.abs(s.y - m.y) < 16 && s.x < m.x - 14; // a clear line straight into her mouth
  if (!toMouth && ((s.x - (b.x - 10)) / 125) ** 2 + ((s.y - (b.y - 20)) / 145) ** 2 < 1) s.dead = true; // the mass of snakes soaks up the rest
}
const KING_IMG = new Image(); KING_IMG.src = 'img/medusa.webp'; // Blue Leaf's concept art; her mouth is at 265,282 in the image
function drawKingSprite(b){
  const k = .64, open = kingOpen(b), m = kingMouth(b), now = performance.now() / 1000;
  ctx.save();
  // laser: a thin warning line at the ship's height, then a golden beam out of her mouth
  if (b.laser){
    if (b.laser.t <= 1){ ctx.strokeStyle = '#ffcf6a'; ctx.globalAlpha = .4 + .4 * Math.sin(b.laser.t * 40); ctx.setLineDash([8, 6]); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(m.x, b.laser.y); ctx.lineTo(0, b.laser.y); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1; }
  }
  const sway = Math.sin(b.t * 1.1) * 1.5;
  ctx.drawImage(KING_IMG, m.x - 265 * k, m.y - 282 * k + sway, 536 * k, 470 * k);
  if (b.flash > 0){ ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = .3; ctx.drawImage(KING_IMG, m.x - 265 * k, m.y - 282 * k + sway, 536 * k, 470 * k); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; }
  if (b.laser && b.laser.t > 1){
    const y = b.laser.y, g = ctx.createLinearGradient(0, y - 11, 0, y + 11);
    g.addColorStop(0, 'rgba(255,170,40,0)'); g.addColorStop(.5, 'rgba(255,245,200,.97)'); g.addColorStop(1, 'rgba(255,170,40,0)');
    ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g; ctx.fillRect(0, y - 11, m.x, 22);
    ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(m.x - 30, y - 8); ctx.lineTo(m.x - 30, y + 8); ctx.closePath(); ctx.fillStyle = 'rgba(255,220,120,.7)'; ctx.fill(); ctx.globalCompositeOperation = 'source-over';
  }

/* boss result: time, hits taken, grade, and this device's best time per stage and ship */
const PAR = { 1:25, 2:60, 3:55, 4:55, 5:200 };
function bossResult(time, hits){
  const par = PAR[G.stage] || 60;
  const grade = hits === 0 && time <= par ? 'S' : hits <= 1 && time <= par * 1.5 ? 'A' : hits <= 3 ? 'B' : 'C';
  const key = `bls_bt_${G.mcfg ? G.mcfg.key : G.stage}_${G.ship}`, prev = Number(store.get(key)) || 0, best = !prev || time < prev;
  if (best && !G.practice) store.set(key, time.toFixed(1));

/* ---------- main update ---------- */
const d2 = (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2;
function update(dt){
  G.t += dt; G.shake = Math.max(0, G.shake - dt);
  const speed = G.boss ? 30 : 60; G.scroll += speed * dt;
  TA = G.boss ? Math.max(0, TA - dt / 3) : Math.min(1, G.t / 5);
  if (s4() && !G.boss && !G.practice){
    updateFork(dt);
    TA = Math.min(TA, G.taF);
    if (G.route === 'up'){
      for (const sw of UP_T) TA = Math.min(TA, Math.max(0, Math.abs(G.t - sw) - .25) / 1.3);
      const k = UP_T.findIndex(sw => G.t >= sw && G.t - dt < sw);
      if (k >= 0){ G.areaBanner = 2.6; G.areaText = [`AREA ${k + 2} / 3`, AREA_NAME['4' + area4()]]; }
    }
    if (G.route === 'down'){ const t = G.t - G.downT0; TA = Math.min(TA, t < 1.2 ? 1 - t / 1.2 : (t - 1.2) / 1.5); }
  }
  if (G.areaBanner > 0) G.areaBanner -= dt;
  while (G.si < G.script.length && G.script[G.si].t <= G.t){ spawn(G.script[G.si].type); G.si++; }
  if (krakenCfg() && !G.ksunk && G.t >= krakenCfg().breakT){
    // the Kraken drags the ship under: shake, the deck drops away, the sea pours in
    G.ksunk = true; G.shake = 1.4; sfx.die(); floatText(W / 2, H / 2 - 40, '船が沈む！', C.coral, 2.2, 18);
    for (const e of G.en) if (e.kind === 'tent'){ e.phase = 'back'; e.t = 0; }
  }

  if (G.p) updatePlayer(dt);
  else { G.respawn -= dt; if (G.respawn <= 0){ if (G.lives > 0){ G.lives--; spawnPlayer(); } else return gameOver(); } }

  for (const s of G.shots){
    s.x += s.vx * dt; s.y += s.vy * dt;
    const wx = s.x + G.scroll;
    if (s.k === 'm' && s.up){ const cy = ceilY(wx); if (!s.ground && s.y <= cy + 4){ s.ground = true; s.vx = 200; s.vy = 0; } if (s.ground) s.y = cy + 4; }
    else if (s.k === 'm'){ const fy = floorY(wx); if (!s.ground && s.y >= fy - 4){ s.ground = true; s.vx = 200; s.vy = 0; } if (s.ground) s.y = fy - 4; }
    else if (s.k === 'n' && (s.y < ceilY(wx) || s.y > floorY(wx))) s.dead = true;
    if (s.k === 'n' && G.fork){ const wg = wedgeAt(wx); if (wg && s.y > wg.top && s.y < wg.bot) s.dead = true; }
    if (s.x - (s.len || 0) > W + 10 || s.y < -10 || s.y > H + 10) s.dead = true;
  }

  for (const e of G.en){

async function sb(path, body){
  const headers = { apikey:CFG.supabaseKey, 'Content-Type':'application/json' };
  if (CFG.supabaseKey.startsWith('eyJ')) headers.Authorization = 'Bearer ' + CFG.supabaseKey;
  const r = await fetch(CFG.supabaseUrl.replace(/\/+$/, '') + '/rest/v1/' + path,
    body === undefined ? { headers } : { method:'POST', headers, body:JSON.stringify(body) });
  if (!r.ok){ let code = ''; try { code = (await r.json()).code || ''; } catch(e){} throw Object.assign(new Error('HTTP ' + r.status), { status:r.status, code }); }
  const txt = await r.text(); return txt ? JSON.parse(txt) : null;

// one row per registration; keep each name's best inside the period so one player does not fill the board
function topByName(rows){
  const seen = new Set(), out = [];
  for (const r of rows || []){
    const name = cleanName(r.name) || 'NO NAME', score = Number(r.score);
    if (!Number.isFinite(score) || seen.has(name)) continue;
    seen.add(name); out.push({ id:r.id, name, score, ship:r.ship, items:r.items }); if (out.length === 10) break;
  }

}
async function loadBoard(force){
  if (!RANK_ON){ rankReady = true; renderBoards(); return; }
  if (!force && Date.now() - lastLoad < 15000) return;
  lastLoad = Date.now();
  try {
    const m0 = monthlyNow(), base = () => `scores?select=id,name,score${tagColumns ? ',ship,items' : ''}&order=score.desc,created_at.asc&limit=60`;
    const since = k => `&created_at=gte.${encodeURIComponent(periodStart(k))}`;
    const q = (k, mode) => sb(base() + since(k) + (mode && modeColumn ? `&mode=eq.${mode}` : ''));
    const all = () => Promise.all([q('month', 'main'), q('year', 'main'), m0 ? q('month', m0.rankKey) : []]);
    let m, y, s = [];
    const tagsAsked = tagColumns; // another load may switch it off while this one is in flight
    try { [m, y, s] = await all(); }
    catch(e){
      if (e.status !== 400) throw e;
      const noColumn = e.code === '42703' || e.code === 'PGRST204'; // only a missing column means "not migrated yet"
      if (!noColumn) throw e;
      // try again without the ship / item columns (database not migrated yet), then without the mode column
      if (tagsAsked){ tagColumns = false; try { [m, y, s] = await all(); boards.month = topByName(m); boards.year = topByName(y); boards.stage = topByName(s); rankError = false; rankReady = true; renderBoards(); return; } catch(e2){ if (e2.status !== 400) throw e2; } }

      modeColumn = false; [m, y] = await Promise.all([q('month'), q('year')]); s = [];
    }
    boards.month = topByName(m); boards.year = topByName(y); boards.stage = topByName(s); rankError = false;
  } catch(e){ rankError = true; }

}
function setPeriod(p){ period = ['month','year','stage'].includes(p) ? p : 'month'; renderBoards(); }

    const stageTab = w.querySelector('[data-p="stage"]'); if (stageTab) stageTab.hidden = !monthlyNow();

    else if (!board.length) msg = period === 'year' ? '今年はまだ記録がありません。' : '今月はまだ記録がありません。今月の1位を狙おう。';
    note.hidden = !msg; note.textContent = msg;
  });

}
function entryBlock(score){

overlay.addEventListener('click', e => {

  if (a.dataset.act === 'start'){ if (!store.get('bls_tut_seen') && !G){ pendingMode = 'main'; showTutorial(0, 'first'); return; } newGame(G ? G.mode : pendingMode); pendingMode = 'main'; }
  if (a.dataset.act === 'monthly'){ if (!store.get('bls_tut_seen')){ pendingMode = 'monthly'; G = null; showTutorial(0, 'first'); return; } newGame('monthly'); }
  if (a.dataset.act === 'resume') togglePause();
  if (a.dataset.act === 'next') nextStage();
  if (a.dataset.act === 'practice') startPractice();
  if (a.dataset.act === 'mode') setMode(a.dataset.mode);
  if (a.dataset.act === 'ship') setShip(a.dataset.ship);
  if (a.dataset.act === 'period' && typeof setPeriod === 'function') setPeriod(a.dataset.p);
  if (a.dataset.act === 'tut') showTutorial(0, G && G.paused ? 'pause' : 'title');
  if (a.dataset.act === 'tut-page') showTutorial(+a.dataset.page, tutFrom);
  if (a.dataset.act === 'tut-back') { if (tutFrom === 'pause') showPause(); else showTitle(); }
  if (a.dataset.act === 'title') { G = null; updatePanel(); showTitle(); playTrack('title'); }
});
let pendingMode = 'main';
function monthlyBlock(){
  const m = monthlyNow(); if (!m) return '';
  return `<div class="monthly"><div class="eyebrow">今月のステージ${m.preview ? '（プレビュー・ランキング登録なし）' : m.current ? '' : '（新しいステージは準備中）'}</div><h3>${m.title}</h3>
    <p class="rule">${m.rule}</p><p>ボス「${m.bossName}」。本編とは別の、このステージだけのランキングで競います。</p>
    <div class="row"><button class="btn" type="button" data-act="monthly">今月のステージに挑戦</button></div></div>`;
}
/* in a phone browser (not yet on the home screen): show how to play full screen without the browser's tabs and address bar */
function installBlock(){
  let framed = false; try { framed = window.top !== window; } catch(e){ framed = true; }
  const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches;
  if (framed || standalone) return '';
  const ua = navigator.userAgent, ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  if (!ios && !/Android/.test(ua)) return '';
  const how = ios ? 'Safari の <b>共有ボタン</b>（□に↑）→ <b>「ホーム画面に追加」</b>' : 'Chrome の <b>︙</b> → <b>「ホーム画面に追加」</b>';
  return `<p class="install-tip">📱 ホーム画面に追加すると、ブラウザのタブやアドレスバーが消えて<b>全画面</b>で遊べます。<br>${how}</p>`;
}

function endScores(){

  return `<div class="score"><div><small>SCORE</small><b>${G.score.toLocaleString()}</b></div><div><small>${isHi ? 'NEW HI-SCORE' : 'HI-SCORE'}</small><b>${hi.toLocaleString()}</b></div></div>`;
}
function gameOver(){
  playTrack('over');
  G.state = 'over'; updatePanel();
  if (G.practice){
    showOverlay(`<div class="eyebrow">Practice</div><h2 class="big">あと少し</h2><p class="lead">STAGE ${G.stage} のボス戦の練習中です（ランキング対象外）。</p>

    return;
  }
  const atBoss = G.boss && !G.bossDead;
  showOverlay(`<div class="eyebrow">Game over</div><h2 class="big">${atBoss && G.boss.gate ? '門番に阻まれた' : 'また挑戦しよう'}</h2>${endScores()}${entryBlock(G.score)}

  fillNick();
}
function startPractice(){
  const sn = G && G.snap; if (!sn) return;
  initAudio(); audioUnlocked = true;
  G = { state:'play', ship:sn.ship, items:sn.items, mode:'main', mcfg:null, stage:sn.stage, score:0, lives:2, paused:false, p:null, hinted:false, practice:true, snap:sn };
  resetStage(); G.script = [{ t:2.4, type:'boss' }]; spawnPlayer(); Object.assign(G.p, sn.p); G.banner = 0;
  hideOverlay(); updatePanel(); playTrack(stageTrack());
}
const practiceBtn = () => G && G.snap ? `<button class="btn ghost" type="button" data-act="practice">ボス戦から練習</button>` : '';
function stageClear(){
  playTrack('clear');
  G.state = 'clear'; const bonus = G.lives * 1000; G.score += bonus; updatePanel();
  if (G.practice){
    showOverlay(`<div class="eyebrow">Practice clear</div><h2 class="big">STAGE ${G.stage} のボスを撃破！</h2>${resultBlock(G.result)}
      <p class="board-note">練習モードはランキングに登録されません。本番で同じ動きを決めよう。</p>
      <div class="row"><button class="btn" type="button" data-act="practice">もう一度ボス戦</button><button class="btn ghost" type="button" data-act="title">タイトルへ</button></div>`);
    return;
  }
  if (G.mode === 'monthly'){
    showOverlay(`<div class="eyebrow">Monthly stage clear</div><h2 class="big">${G.mcfg.short} クリア！</h2>${endScores()}
      ${entryBlock(G.score)}
      <div class="row"><button class="btn" type="button" data-act="start">もう一度</button><button class="btn ghost" type="button" data-act="title">タイトルへ</button></div>${boardBlock}${studioBlock}`);
    fillNick(); return;
  }
  if (G.stage < LAST_STAGE){
    const n = G.stage + 1;
    const BEAT = { core:'コアを撃破！', jelly:G.boss && G.boss.gate ? '門番を突破！' : '深淵クラゲを撃破！', fort:'幽霊戦艦を撃破！', worm:'ヒートワームを撃破！' };
    showOverlay(`<div class="eyebrow">Stage ${G.stage} clear</div><h2 class="big">${BEAT[G.boss && G.boss.type] || 'ボスを撃破！'}</h2>

      <div class="score"><div><small>SCORE</small><b>${G.score.toLocaleString()}</b></div><div><small>残機ボーナス</small><b>+${bonus.toLocaleString()}</b></div></div>
      <p class="lead">次は STAGE ${n}「${STAGES[n].name}」（注意：${STAGES[n].warn}）。強化と残機はそのまま引き継ぎます。</p>
      <div class="row"><button class="btn" type="button" data-act="next">STAGE ${n} へ</button><button class="btn ghost" type="button" data-act="title">タイトルへ</button></div>`);
    return;
  }
  showOverlay(`<div class="eyebrow">All stages clear</div><h2 class="big">深海の王を倒した！</h2>${resultBlock(G.result)}${endScores()}
    <p class="lead">残機ボーナス込みのスコアです。</p>
    ${entryBlock(G.score)}
    <div class="row"><button class="btn" type="button" data-act="start">もう一度</button><button class="btn ghost" type="button" data-act="title">タイトルへ</button></div>${boardBlock}${studioBlock}`);
  fillNick();
}
function togglePause(){
  if (!G || G.state !== 'play') return;

  if (G.paused) showPause();
  else hideOverlay();
}

}

    ctx.strokeStyle = 'rgba(255,138,61,.6)'; ctx.setLineDash([3, 4]); ctx.beginPath(); ctx.moveTo(x, fy - 14); ctx.quadraticCurveTo(x + 60, -40, x + 130, fy - 4); ctx.stroke(); ctx.setLineDash([]);
    drawEnemy({ kind:'ember', x:x + 70, y:16, t:.3 }); drawEnemy({ kind:'ember', x:x + 112, y:fy - 26, t:1 }); },
  'en-worm'(w, h){ const hist = []; for (let i = 0; i < 80; i++) hist.push({ x:w * .45 + (79 - i) * 2.6, y:h / 2 + Math.sin(i * .09 + 2) * 18 });
    const b = { type:'worm', x:hist[79].x, y:hist[79].y, t:0, segs:Array.from({ length:8 }, (_, i) => ({ hp:i === 3 ? 0 : 4 })), hist, flash:0 };
    drawWorm(b); fx.label(b.x - 56, b.y + 4, '頭（弱点）', C.coral); drawLeaf(26, h / 2, 1, false); },
  'en-jelly'(w, h){ const b = { type:'jelly', x:w - 80, y:h / 2 - 8, t:3, flash:0, dead:false }; drawJelly(b); for (let k = 0; k < 8; k++){ const a = k / 8 * 6.283; fx.bullet(b.x - 4 + Math.cos(a) * 58, b.y + 6 + Math.sin(a) * 40); } drawLeaf(30, h / 2, 1, false); },
  'en-fort'(w, h){ const s = .58, ox = w - 120, oy = h / 2 + 18, b = { type:'fort', x:0, y:0, t:0, hp:24, cannons:[{ dx:-25, dy:-44, hp:12 }, { dx:-12, dy:36, hp:0 }], flash:0, dead:false };
    ctx.save(); ctx.translate(ox, oy); ctx.scale(s, s); drawFort(b); ctx.restore();
    fx.label(ox - 25 * s - 34, oy - 44 * s - 8, '大砲', C.coral); fx.label(ox - 12 * s - 92, oy + 36 * s + 6, '鬼火（破壊）', C.mute); fx.label(ox - 39 * s - 34, oy + 4, '口', C.sun);
    for (let k = 0; k < 3; k++) fx.bullet(ox - 25 * s - 50 - k * 18, oy - 44 * s + 2 + k * 6); drawLeaf(30, h / 2 + 10, 1, false); },
  'en-boss'(w, h){ const b = { x:w - 70, y:h / 2, t:0, plates:[5, 5, 5], flash:0, dead:false };
    ctx.save(); ctx.translate(b.x, b.y); ctx.scale(.5, .5); ctx.translate(-b.x, -b.y); drawBoss(b); ctx.restore();
    fx.label(b.x - 78, b.y - 22, '装甲×3', C.edge); fx.label(b.x - 74, b.y + 30, 'コア（中心）', C.coral); for (let k = -2; k <= 2; k++){ const a = Math.PI + k * .22; fx.bullet(b.x - 70 + Math.cos(a) * 40, b.y + Math.sin(a) * 40); } drawLeaf(30, h / 2, 1, false); },
  'it-flow'(w, h){
    const y = 26, cw = Math.max(20, Math.min(30, (w - 160) / 6 - 2)), gx = 60;
    fx.cap(18, y); fx.label(18, y + 22, '取る', C.sun);
    fx.arrow(32, y, 54);
    ['SPD','MIS','TWN','BEM','DRN','SHD'].forEach((n, i) => { const x = gx + i * (cw + 2); ctx.strokeStyle = 'rgba(143,179,191,.4)'; ctx.lineWidth = 1; ctx.strokeRect(x, y - 11, cw, 22); if (i === 1){ ctx.fillStyle = C.sun; ctx.fillRect(x, y - 11, cw, 22); } fx.label(x + cw / 2, y + 4, n, i === 1 ? C.sea : C.mute); });
    const ex = gx + 6 * (cw + 2); fx.arrow(ex + 2, y, ex + 20);
    const pw = Math.min(58, w - ex - 26);
    ctx.fillStyle = C.leaf; ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(ex + 24, y - 12, pw, 24, 6); else ctx.rect(ex + 24, y - 12, pw, 24); ctx.fill(); fx.label(ex + 24 + pw / 2, y + 4, 'POWER', C.sea);
    fx.label(gx + 1.5 * (cw + 2), y + 26, '↑ 1つ進む', C.sun);
    fx.label(ex + 24 + pw / 2, y + 26, '押す', C.leaf);
    const by = h - 18;
    ctx.textAlign = 'left'; ctx.font = '500 10px ' + getComputedStyle(document.documentElement).getPropertyValue('--f-mono'); ctx.fillStyle = C.mute; ctx.fillText('例）MIS が光っている時に POWER', 12, by - 16);
    drawLeaf(30, by, 1, false); fx.arrow(52, by, 84, C.sun); drawLeaf(108, by, 1, false); fx.dots(110, by + 4, 150, by + 14, C.sun);
    ctx.fillStyle = C.sun; ctx.beginPath(); ctx.moveTo(156, by + 15); ctx.lineTo(148, by + 11); ctx.lineTo(148, by + 18); ctx.fill();
    fx.label(Math.min(w - 40, 200), by + 4, 'ミサイルが付く', C.sun);
  },
  'it-speed'(w, h){ const y = h / 2; ctx.strokeStyle = 'rgba(92,200,255,.5)'; ctx.lineWidth = 2; for (let i = 0; i < 4; i++){ ctx.beginPath(); ctx.moveTo(w * .5 - 30 - i * 14, y - 9 + i * 6); ctx.lineTo(w * .5 - 18 - i * 14 - 18, y - 9 + i * 6); ctx.stroke(); } drawLeaf(w * .5, y, 1, false); fx.label(w * .5 + 50, y + 4, '×4段階', C.sun); },
  'it-missile'(w, h){ const fy = h - 12; fx.ground(w, fy, false); drawLeaf(40, 18, 1, false); ctx.strokeStyle = C.sun; ctx.setLineDash([3, 4]); ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(44, 24); ctx.quadraticCurveTo(70, fy - 8, 110, fy - 8); ctx.lineTo(w - 70, fy - 8); ctx.stroke(); ctx.setLineDash([]); const mx = w - 64, my = fy - 8; ctx.fillStyle = C.sun; ctx.beginPath(); ctx.moveTo(mx + 5, my); ctx.lineTo(mx - 4, my - 3); ctx.lineTo(mx - 4, my + 3); ctx.fill(); drawEnemy({ kind:'tur', x:w - 30, y:fy - 6, top:false, t:0, aimAt:{ x:40, y:18 } }); },
  'it-twin'(w, h){ const y = h - 22; drawLeaf(40, y, 1, false); for (let i = 1; i <= 4; i++){ fx.shot(52 + i * 30, y); fx.shot(52 + i * 18, y - i * 14, -Math.PI / 4); } },
  'it-beam'(w, h){ const y = h / 2; drawLeaf(34, y, 1, false); drawEnemy({ kind:'fan', x:w * .5, y, t:.2 }); drawEnemy({ kind:'fan', x:w * .66, y, t:.7 }); drawEnemy({ kind:'fan', x:w * .82, y, t:1.1 }); ctx.strokeStyle = C.leaf; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(52, y); ctx.lineTo(w - 12, y); ctx.stroke(); ctx.strokeStyle = C['leaf-hi']; ctx.lineWidth = 1; ctx.stroke(); fx.label(w * .66, y - 16, 'つらぬく', C.leaf); },
  'it-drone'(w, h){ const pts = [[w * .62, h / 2 - 8], [w * .42, h / 2 + 12], [w * .22, h / 2 - 6]]; fx.dots(pts[2][0], pts[2][1], pts[0][0], pts[0][1], 'rgba(92,200,255,.5)'); drawLeaf(pts[0][0], pts[0][1], 1, false); [pts[1], pts[2]].forEach(([x, y]) => { ctx.fillStyle = C['leaf-hi']; ctx.beginPath(); ctx.arc(x, y, 4, 0, 6.283); ctx.fill(); ctx.strokeStyle = C.leaf; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x, y, 7, 0, 6.283); ctx.stroke(); fx.shot(x + 22, y); }); fx.shot(pts[0][0] + 30, pts[0][1]); fx.label(pts[2][0], pts[2][1] + 22, '最大2つ', C.sun); },
  'die-block'(w, h){ const x0 = w * .55; for (let c = 0; c < 2; c++) for (let r = 0; r < 5; r++){ const x = x0 + c * 14, y = 10 + r * 14; ctx.fillStyle = '#3a2a20'; ctx.fillRect(x - 7, y - 7, 14, 14); ctx.strokeStyle = '#d39a5b'; ctx.lineWidth = 1; ctx.strokeRect(x - 6.5, y - 6.5, 13, 13); } drawLeaf(x0 - 20, 38, 1, false); fx.miss(x0 - 12, 38); },
  'en-wall'(w, h){ const x0 = w * .62; for (let c = 0; c < 2; c++) for (let r = 0; r < 5; r++){ const x = x0 + c * 14, y = 10 + r * 14, chest = c === 0 && r === 3, gone = c === 0 && r === 2;
      if (gone) continue; ctx.fillStyle = chest ? C.sun : '#3a2a20'; ctx.fillRect(x - 7, y - 7, 14, 14); ctx.strokeStyle = chest ? C.sea : '#d39a5b'; ctx.lineWidth = 1; ctx.strokeRect(x - 6.5, y - 6.5, 13, 13); }
    drawLeaf(34, 38, 1, false); for (let i = 0; i < 3; i++) fx.shot(70 + i * 26, 38); fx.label(x0 - 6, h - 4, '撃って穴を開ける', C.sun); fx.label(x0 + 40, 62, '宝箱', C.sun); },
  'en-rear'(w, h){ const y = h / 2; drawLeaf(w * .6, y, 1, false); for (let i = 0; i < 3; i++) drawEnemy({ kind:'rear', x:20 + i * 30, y:y + 16 * Math.sin(i), t:0 }); fx.arrow(w * .3, y + 24, w * .5, C.coral); fx.label(w * .4, y + 38, '後ろから来る', C.coral); },
  'it-auto'(w, h){ const y = h / 2 + 6; fx.cap(26, y); fx.label(26, y + 22, '取る', C.sun); fx.arrow(42, y, 80, C.sun); drawLeaf(110, y, 1, false); fx.label(110, y - 18, 'MISSILE UP!', C.leaf); fx.arrow(140, y, 170); fx.cap(186, y); fx.arrow(200, y, 230, C.sun); drawLeaf(Math.min(w - 30, 258), y, 1, false); fx.label(Math.min(w - 30, 258), y - 18, 'TWIN UP!', C.leaf); },
  'it-sniper'(w, h){ const x = w * .3, y = h / 2; drawLeaf(x, y, 1, false); const tg = [{ x:w * .78, y:14 }, { x:w * .7, y:h - 12 }];
    [[x - 2, y - 20], [x - 2, y + 20]].forEach(([sx, sy], i) => { const t = tg[i], a = Math.atan2(t.y - sy, t.x - sx); ctx.save(); ctx.translate(sx, sy); ctx.fillStyle = C.sun; ctx.beginPath(); ctx.moveTo(0, -5); ctx.lineTo(5, 0); ctx.lineTo(0, 5); ctx.lineTo(-5, 0); ctx.closePath(); ctx.fill(); ctx.rotate(a); ctx.strokeStyle = C.sun; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(2, 0); ctx.lineTo(10, 0); ctx.stroke(); ctx.restore();
      fx.dots(sx + 10, sy, t.x - 10, t.y, C['leaf-hi']); fx.shot(sx + (t.x - sx) * .5, sy + (t.y - sy) * .5, a); drawEnemy({ kind:'fan', x:t.x, y:t.y, t:i }); });
    fx.label(w * .3, h - 4, '自動でねらう', C.sun); },
  'it-shield'(w, h){ const x = w * .38, y = h / 2; drawLeaf(x, y, 1, false); ctx.strokeStyle = C.leaf; ctx.globalAlpha = .95; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(x + 2, y, 18, -1.15, 1.15); ctx.stroke(); ctx.globalAlpha = 1; fx.bullet(x + 26, y - 6); fx.dots(x + 30, y - 6, w * .8, y - 18, C.coral); fx.label(w * .78, y + 18, '4回まで防ぐ（LEAF）', C.sun); }
};

/* ---------- loop ---------- */
let last = performance.now();
function frame(now){
  const dt = Math.min(.033, (now - last) / 1000); last = now; bgScroll += 40 * dt;
  if (G && G.state === 'play' && !G.paused) update(dt);
  draw(); hud(); tickMusic();
  requestAnimationFrame(frame);
}
resize(); updatePanel(); showTitle(); requestAnimationFrame(frame); loadBoard(true);
})();
</script>
